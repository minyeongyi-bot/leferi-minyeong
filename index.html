<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Performance LAB · v13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Pretendard:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #faf9f6;
  --bg-card: #f5f3ed;
  --line: #e5e1d8;
  --line-soft: #efece4;
  --ink: #1a1815;
  --ink-soft: #5a554d;
  --ink-mute: #9c968a;
  --accent: #b8860b;
  --accent-bg: #faf3e3;
  --green: #15803d;
  --green-bg: #ecfdf5;
  --red: #b91c1c;
  --red-bg: #fee2e2;
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --blue: #185FA5;
  --purple: #534AB7;
  --orange: #D85A30;
  --teal: #1D9E75;
  --pink: #D4537E;
  --serif: 'Fraunces', 'Pretendard', serif;
  --sans: 'Pretendard', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
}

/* ============ LOADING ============ */
#loading {
  position: fixed; inset: 0; background: var(--bg); z-index: 99999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#loading .title {
  font-family: var(--serif); font-size: 26px; font-weight: 500;
  font-style: italic; letter-spacing: -0.02em; margin-bottom: 10px;
}
#loading .sub {
  font-family: var(--mono); font-size: 11px; color: var(--ink-mute);
  letter-spacing: 0.12em; text-transform: uppercase;
}
#loading .spinner {
  width: 32px; height: 32px; border: 2px solid var(--line);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-top: 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ MASTHEAD ============ */
.masthead {
  border-bottom: 2px solid var(--ink);
  padding: 28px 48px 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.eyebrow {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent); font-weight: 500; margin-bottom: 6px;
}
.masthead h1 {
  font-family: var(--serif); font-weight: 400; font-size: 32px;
  letter-spacing: -0.025em; font-style: italic; line-height: 1;
}
.masthead h1 em { font-style: normal; font-weight: 600; }
.masthead-right {
  font-family: var(--mono); font-size: 10px; color: var(--ink-mute);
  text-align: right; line-height: 1.7;
}

/* ============ CONTROLS BAR ============ */
.controls {
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
  padding: 14px 48px;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.ctrl-group { display: flex; align-items: center; gap: 10px; }
.ctrl-label {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-mute); font-weight: 500;
}
.ctrl-segment {
  display: inline-flex;
  border: 1px solid var(--ink);
}
.ctrl-segment button {
  background: transparent; border: none;
  border-right: 1px solid var(--ink);
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.12em; padding: 6px 12px;
  cursor: pointer; color: var(--ink); font-weight: 500;
  text-transform: uppercase;
}
.ctrl-segment button:last-child { border-right: none; }
.ctrl-segment button:hover { background: var(--bg-card); }
.ctrl-segment button.active {
  background: var(--ink); color: var(--bg); font-weight: 600;
}
.ctrl-status {
  margin-left: auto;
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-mute); letter-spacing: 0.08em;
}
.ctrl-status .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ============ HERO ============ */
.hero {
  padding: 36px 48px 32px;
  border-bottom: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 32px;
  align-items: center;
}
.hero-id { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.hero-label-pill {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase;
  background: var(--ink); color: var(--bg);
  padding: 4px 10px; font-weight: 500;
}
.hero-name {
  font-family: var(--serif); font-weight: 600; font-size: 34px;
  letter-spacing: -0.025em; line-height: 1;
}
.hero-handle {
  font-family: var(--mono); font-size: 12px; color: var(--ink-mute);
  letter-spacing: 0.02em;
}
.hero-stats {
  display: flex; gap: 28px; align-items: baseline; margin-top: 14px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
}
.hero-stats .stat-val {
  color: var(--ink); font-weight: 600; font-size: 14px;
  font-family: var(--serif); margin-left: 6px;
}

/* ============ HEALTH SCORE (메인 KPI) ============ */
.health-block {
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 6px;
}
.health-eyebrow {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-mute);
}
.health-grade-row {
  display: flex; align-items: baseline; gap: 14px;
}
.health-score {
  font-family: var(--serif); font-size: 72px;
  font-weight: 600; line-height: 1; letter-spacing: -0.04em;
}
.health-score .max {
  font-family: var(--mono); font-size: 16px;
  color: var(--ink-mute); font-weight: 400;
  margin-left: 2px;
}
.health-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; font-family: var(--mono); font-size: 11px;
  font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  border: 1.5px solid;
}
.health-badge.healthy { color: var(--green); border-color: var(--green); background: var(--green-bg); }
.health-badge.watch { color: var(--amber); border-color: var(--amber); background: var(--amber-bg); }
.health-badge.high { color: var(--red); border-color: var(--red); background: var(--red-bg); }
.health-badge .bdot {
  width: 7px; height: 7px; border-radius: 50%;
}
.health-badge.healthy .bdot { background: var(--green); }
.health-badge.watch .bdot { background: var(--amber); }
.health-badge.high .bdot { background: var(--red); animation: pulse 1.5s infinite; }

/* ============ 5축 미니 카드 ============ */
.pentagon-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-bottom: 1px solid var(--line);
}
.pent-cell {
  padding: 22px 26px;
  border-right: 1px solid var(--line);
}
.pent-cell:last-child { border-right: none; }
.pent-name {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 8px;
}
.pent-score {
  font-family: var(--serif); font-size: 34px; font-weight: 500;
  line-height: 1; letter-spacing: -0.02em;
}
.pent-score.good { color: var(--green); }
.pent-score.mid { color: var(--amber); }
.pent-score.low { color: var(--red); }
.pent-bar {
  margin-top: 10px; height: 3px; background: var(--bg-card);
  overflow: hidden;
}
.pent-bar-fill { height: 100%; transition: width 0.6s ease; }
.pent-bar-fill.good { background: var(--green); }
.pent-bar-fill.mid { background: var(--amber); }
.pent-bar-fill.low { background: var(--red); }
.pent-sub {
  font-family: var(--mono); font-size: 10px; color: var(--ink-soft);
  margin-top: 8px; line-height: 1.5;
}

/* ============ SECTION ============ */
.section {
  padding: 48px 48px;
  border-bottom: 1px solid var(--line);
}
.sec-head {
  display: flex; align-items: baseline; gap: 16px;
  margin-bottom: 24px; padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.sec-num {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.22em; color: var(--accent); font-weight: 500;
}
.sec-title {
  font-family: var(--serif); font-size: 26px; font-weight: 400;
  letter-spacing: -0.025em; font-style: italic;
}
.sec-title em { font-style: normal; font-weight: 600; }
.sec-sub {
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-mute); margin-left: auto;
  letter-spacing: 0.05em;
}

/* ============ SUB KPI ============ */
.subkpi-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px; background: var(--line);
  border: 1px solid var(--line);
  margin-bottom: 28px;
}
.subkpi {
  background: var(--bg); padding: 18px 22px;
}
.subkpi-name {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 8px;
}
.subkpi-val {
  font-family: var(--serif); font-size: 26px; font-weight: 500;
  line-height: 1; letter-spacing: -0.02em;
}
.subkpi-val.pos { color: var(--green); }
.subkpi-val.neg { color: var(--red); }
.subkpi-val .unit {
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-mute); font-weight: 400; margin-left: 3px;
}
.subkpi-sub {
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-soft); margin-top: 6px;
}

/* ============ CHART CARDS ============ */
.chart-card {
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 22px 24px;
}
.chart-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.chart-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
.chart-title {
  font-family: var(--serif); font-size: 15px; font-weight: 600;
  font-style: italic; margin-bottom: 3px;
}
.chart-sub {
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-mute); margin-bottom: 14px;
}
.chart-canvas {
  position: relative; height: 240px;
}
.chart-canvas.tall { height: 300px; }
.chart-canvas.short { height: 180px; }
.chart-legend {
  display: flex; flex-wrap: wrap; gap: 14px;
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-soft); margin-bottom: 12px;
}
.lg-dot {
  display: inline-block; width: 10px; height: 10px;
  border-radius: 1px; margin-right: 5px; vertical-align: middle;
}

/* ============ FLOW (구독자 흐름) ============ */
.flow-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 1px; background: var(--line);
  border: 1px solid var(--line);
  margin-bottom: 24px;
}
.flow-cell {
  background: var(--bg); padding: 22px 26px;
  border-left: 3px solid transparent;
}
.flow-cell.gained { border-left-color: var(--green); }
.flow-cell.lost { border-left-color: var(--red); }
.flow-cell.net { border-left-color: var(--ink); }
.flow-name {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 10px;
}
.flow-val {
  font-family: var(--serif); font-size: 36px; font-weight: 500;
  line-height: 1; letter-spacing: -0.025em;
}
.flow-val.pos { color: var(--green); }
.flow-val.neg { color: var(--red); }
.flow-sub {
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-soft); margin-top: 8px;
}

/* ============ FORMAT (롱폼 vs 숏폼) ============ */
.fmt-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; background: var(--line);
  border: 1px solid var(--line);
}
.fmt-cell { background: var(--bg); padding: 26px 30px; }
.fmt-eyebrow {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 4px;
}
.fmt-name {
  font-family: var(--serif); font-size: 28px; font-weight: 500;
  font-style: italic; letter-spacing: -0.025em;
  margin-bottom: 18px; padding-bottom: 14px;
  border-bottom: 1px solid var(--line-soft);
}
.fmt-name.long { color: var(--purple); }
.fmt-name.short { color: var(--orange); }
.fmt-row {
  display: flex; justify-content: space-between;
  align-items: baseline; padding: 9px 0;
  border-bottom: 1px solid var(--line-soft);
}
.fmt-row:last-child { border-bottom: none; }
.fmt-row .metric { font-size: 12.5px; color: var(--ink-soft); }
.fmt-row .value {
  font-family: var(--mono); font-size: 14px; font-weight: 600;
}
.fmt-row .winner {
  font-family: var(--mono); font-size: 9px;
  background: var(--ink); color: var(--bg);
  padding: 1px 5px; margin-left: 6px;
  letter-spacing: 0.12em;
}

/* ============ TABLE ============ */
.tbl {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.tbl th {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-mute); text-align: left;
  padding: 10px 8px; border-bottom: 1.5px solid var(--ink);
  font-weight: 600;
}
.tbl th.num { text-align: right; }
.tbl td {
  padding: 11px 8px;
  border-bottom: 1px solid var(--line-soft);
  color: var(--ink-soft);
}
.tbl td.num {
  font-family: var(--mono); text-align: right;
  font-weight: 600; color: var(--ink);
}
.tbl td.title {
  color: var(--ink); max-width: 320px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tbl td.tag {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.1em; font-weight: 600;
  text-transform: uppercase;
}
.tbl td.tag.long { color: var(--purple); }
.tbl td.tag.short { color: var(--orange); }
.tbl tr:hover td { background: var(--bg-soft); }

.tbl-scroll {
  max-height: 480px; overflow-y: auto;
  border: 1px solid var(--line);
}
.tbl-scroll thead th {
  position: sticky; top: 0; background: var(--bg); z-index: 1;
  box-shadow: 0 1px 0 var(--ink);
}

.bw-tabs {
  display: flex; gap: 0; margin-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.bw-tab {
  background: transparent; border: none;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-mute); padding: 10px 16px;
  cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1px; font-weight: 600;
}
.bw-tab.active {
  color: var(--ink); border-bottom-color: var(--accent);
}

.bw-grid-split {
  display: grid; grid-template-columns: 1fr 1fr; gap: 28px;
}
.bw-col h4 {
  font-family: var(--serif); font-size: 16px;
  font-style: italic; font-weight: 600;
  margin-bottom: 12px;
}
.bw-col.best h4 { color: var(--green); }
.bw-col.worst h4 { color: var(--red); }

/* ============ FOOTER ============ */
.foot {
  padding: 32px 48px;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.12em; color: var(--ink-mute);
  display: flex; justify-content: space-between;
  text-transform: uppercase;
}

/* ============ EMPTY/WARN ============ */
.empty {
  padding: 48px; text-align: center; color: var(--ink-mute);
  font-size: 13px; background: var(--bg-soft);
  border: 1px dashed var(--line);
}
.warn-banner {
  background: var(--amber-bg);
  border: 1px solid var(--amber);
  border-left: 3px solid var(--amber);
  padding: 10px 14px; margin-bottom: 18px;
  font-size: 12px; color: #78350f;
  font-family: var(--mono); letter-spacing: 0.02em;
}

/* ============ DIAGNOSIS ============ */
.diagnosis {
  margin-top: 24px; padding: 16px 22px;
  background: var(--bg-soft);
  border-left: 3px solid var(--ink);
  font-family: var(--serif); font-size: 15px;
  font-style: italic; line-height: 1.6;
}
.diagnosis.healthy { border-left-color: var(--green); }
.diagnosis.watch { border-left-color: var(--amber); }
.diagnosis.high { border-left-color: var(--red); }
.diag-tag {
  font-family: var(--mono); font-size: 10px;
  font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; margin-right: 10px;
  font-style: normal;
}
.diagnosis strong { font-weight: 600; font-style: normal; }

@media (max-width: 1024px) {
  .pentagon-row { grid-template-columns: repeat(2, 1fr); }
  .subkpi-grid { grid-template-columns: repeat(2, 1fr); }
  .chart-grid-2, .chart-grid-3 { grid-template-columns: 1fr; }
  .flow-grid, .fmt-grid { grid-template-columns: 1fr; }
  .bw-grid-split { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; }
  .health-block { align-items: flex-start; }
}
</style>
</head>
<body>

<div id="loading">
  <div class="title">Creator Performance LAB</div>
  <div class="sub">Loading sheet data</div>
  <div class="spinner"></div>
</div>

<div id="app" style="display:none;">

<header class="masthead">
  <div>
    <div class="eyebrow">Creator Performance LAB · Vol. 13 · Realtime</div>
    <h1>Channel <em>Performance</em> Review</h1>
  </div>
  <div class="masthead-right">
    LEFERI ENT. INTERNAL · CONFIDENTIAL<br/>
    구독자 흐름 · 트렌드 · 영상 랭킹 · 롱폼 vs 숏폼
  </div>
</header>

<div class="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">Creator</span>
    <div class="ctrl-segment" id="creator-tabs"></div>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Period</span>
    <div class="ctrl-segment" id="period-tabs">
      <button data-period="all" class="active">전체</button>
      <button data-period="last4">최근 4주</button>
      <button data-period="last8">8주</button>
      <button data-period="last12">12주</button>
    </div>
  </div>
  <div class="ctrl-status">
    <span class="dot"></span>
    <span id="updated-label">실시간 동기화</span>
  </div>
</div>

<main id="dash"></main>

<footer class="foot">
  <span>Creator Performance LAB · v13</span>
  <span id="footer-meta"></span>
</footer>

</div>

<script>
// ==============================================
// CONFIG
// ==============================================
const SHEET_URLS = {
  creators_master: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSIP5FW1AH-o7gHSrDBU7NgYL1U-uySjqivg3XXPBE19NsjMZEh170Rj1y8pMTd8rrHdULW4tG-YPm3/pub?gid=2061700318&single=true&output=csv',
  weekly_metrics:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vSIP5FW1AH-o7gHSrDBU7NgYL1U-uySjqivg3XXPBE19NsjMZEh170Rj1y8pMTd8rrHdULW4tG-YPm3/pub?gid=2031962060&single=true&output=csv',
  videos:          'https://docs.google.com/spreadsheets/d/e/2PACX-1vSIP5FW1AH-o7gHSrDBU7NgYL1U-uySjqivg3XXPBE19NsjMZEh170Rj1y8pMTd8rrHdULW4tG-YPm3/pub?gid=437127923&single=true&output=csv'
};

// ==============================================
// UTILITIES
// ==============================================
const fmt = {
  num: n => Math.round(n || 0).toLocaleString('ko-KR'),
  numK: n => {
    n = n || 0;
    const abs = Math.abs(n);
    if (abs >= 1e8) return (n/1e8).toFixed(2) + '억';
    if (abs >= 1e4) return Math.round(n/1e4) + '만';
    if (abs >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return Math.round(n).toString();
  },
  pct: (n, d=2) => (n||0).toFixed(d) + '%',
  signed: n => (n>=0?'+':'') + Math.round(n||0).toLocaleString('ko-KR'),
};

const esc = (s) => {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
};

function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], nx = text[i+1];
    if (inQ) {
      if (ch === '"' && nx === '"') { field += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { field += ch; }
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\r') {}
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += ch; }
    }
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

function csvToObjects(text) {
  const rows = parseCSV(text).filter(r => r.length > 0 && r.some(c => c !== ''));
  if (rows.length < 1) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i] !== undefined ? r[i] : '').trim());
    return obj;
  });
}

const num = v => {
  if (v === '' || v == null) return 0;
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
};

function dateToWeekLabel(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  const month = d.getMonth() + 1;
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const firstDay = first.getDay() === 0 ? 7 : first.getDay();
  const firstMondayDate = firstDay === 1 ? 1 : (1 + (8 - firstDay));
  const dayOfMonth = d.getDate();
  if (dayOfMonth < firstMondayDate) {
    const prev = new Date(d.getFullYear(), d.getMonth(), 0);
    const fmt = pd => pd.getFullYear() + '-' + String(pd.getMonth()+1).padStart(2,'0') + '-' + String(pd.getDate()).padStart(2,'0');
    return dateToWeekLabel(fmt(prev));
  }
  const weekOfMonth = Math.floor((dayOfMonth - firstMondayDate) / 7) + 1;
  return month + '월 ' + weekOfMonth + '주';
}

async function fetchCSV(url, name) {
  try {
    const r = await fetch(url, { mode: 'cors', cache: 'no-cache' });
    if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
    const text = await r.text();
    if (!text || text.trim().length === 0) throw new Error(`${name}: 빈 응답 (시트 게시 확인 필요)`);
    if (text.trim().startsWith('<')) throw new Error(`${name}: HTML 응답 받음 (시트가 게시되지 않았거나 권한 문제)`);
    return text;
  } catch (err) {
    console.error(`[Fetch failed: ${name}]`, err);
    throw err;
  }
}

async function loadData() {
  console.log('[Loading] Starting fetch...');
  const [m, w, v] = await Promise.all([
    fetchCSV(SHEET_URLS.creators_master, 'creators_master'),
    fetchCSV(SHEET_URLS.weekly_metrics, 'weekly_metrics'),
    fetchCSV(SHEET_URLS.videos, 'videos'),
  ]);
  
  DATA.masters = csvToObjects(m).filter(r => !r.active || r.active.toLowerCase() !== 'false');
  DATA.weekly = csvToObjects(w);
  DATA.videos = csvToObjects(v);
  
  console.log('[Loaded]', { masters: DATA.masters.length, weekly: DATA.weekly.length, videos: DATA.videos.length });
  if (DATA.masters.length > 0) console.log('[Sample master]', DATA.masters[0]);
  if (DATA.weekly.length > 0) console.log('[Sample weekly]', DATA.weekly[0]);
  if (DATA.videos.length > 0) console.log('[Sample video]', DATA.videos[0]);
}

function getCreatorWeekly(creator) {
  const cid = creator.creator_id;
  const channelId = creator.channel_id;
  
  // 1차: creator_id로 매칭
  let rows = DATA.weekly.filter(w => w.creator_id === cid);
  
  // 2차 폴백: creator_id 매칭 실패 시 channel_id로 시도
  if (rows.length === 0 && channelId) {
    rows = DATA.weekly.filter(w => w.channel_id === channelId);
    if (rows.length > 0) {
      console.warn(`[Fallback] creator_id "${cid}"로 매칭 실패. channel_id "${channelId}"로 ${rows.length}행 매칭됨. 시트의 creator_id 일관성을 확인하세요.`);
    }
  }
  
  // 같은 week_start 중복 시 합산 병합 (uploads류만 합산, 나머지는 마지막 값)
  const byWeek = {};
  rows.forEach(w => {
    const key = w.week_start || w.week;
    if (!byWeek[key]) {
      byWeek[key] = { ...w };
    } else {
      // 중복 발견: 누적 컬럼만 합산, 스냅샷 컬럼은 마지막 값 유지
      ['sub_gained','sub_lost','sub_net','views','views_long','views_short',
       'watch_time_hr','comments','shares','likes',
       'uploads_long','uploads_short','uploads_total'].forEach(k => {
        byWeek[key][k] = (num(byWeek[key][k]) + num(w[k])).toString();
      });
      console.warn(`[Duplicate] 중복 주차 ${key} 병합됨 (creator: ${cid})`);
    }
  });
  
  return Object.values(byWeek)
    .sort((a, b) => (a.week_start || '').localeCompare(b.week_start || ''))
    .map(w => ({
      week_start: w.week_start,
      week_label: dateToWeekLabel(w.week_start),
      subscribers: num(w.subscribers),
      sub_gained: num(w.sub_gained),
      sub_lost: num(w.sub_lost),
      sub_net: num(w.sub_net),
      views: num(w.views),
      views_long: num(w.views_long),
      views_short: num(w.views_short),
      avg_view_pct: num(w.avg_view_pct),
      watch_time_hr: num(w.watch_time_hr),
      comments: num(w.comments),
      shares: num(w.shares),
      likes: num(w.likes),
      uploads_long: num(w.uploads_long),
      uploads_short: num(w.uploads_short),
      uploads_total: num(w.uploads_total) || (num(w.uploads_long) + num(w.uploads_short)),
      engagement_rate: num(w.engagement_rate),
      spv: num(w.spv),
      returning_viewer_pct: num(w.returning_viewer_pct),
    }));
}

function getCreatorVideos(creator) {
  const cid = creator.creator_id;
  const channelId = creator.channel_id;
  
  // 1차: creator_id로 매칭
  let rows = DATA.videos.filter(v => v.creator_id === cid && v.title);
  
  // 2차 폴백: channel_id로
  if (rows.length === 0 && channelId) {
    rows = DATA.videos.filter(v => v.channel_id === channelId && v.title);
  }
  
  // video_id 중복 제거 (같은 video_id가 여러 번 들어있으면 첫 번째만)
  const seen = new Set();
  rows = rows.filter(v => {
    if (!v.video_id) return true;
    if (seen.has(v.video_id)) return false;
    seen.add(v.video_id);
    return true;
  });
  
  return rows
    .map(v => ({
      video_id: v.video_id,
      title: v.title,
      published_at: v.published_at,
      week_label: dateToWeekLabel(v.published_at),
      duration_sec: num(v.duration_sec),
      video_type: v.video_type || (num(v.duration_sec) >= 60 ? 'long' : 'short'),
      views: num(v.views),
      likes: num(v.likes),
      comments: num(v.comments),
      shares: num(v.shares),
      h3_category: v['3h_category'] || '',
      biz_org: v.biz_org || '',
    }))
    .sort((a, b) => (b.published_at || '').localeCompare(a.published_at || ''));
}

function filterByPeriod(weekly) {
  const p = STATE.period;
  if (p === 'all' || weekly.length === 0) return weekly;
  if (p === 'last4') return weekly.slice(-4);
  if (p === 'last8') return weekly.slice(-8);
  if (p === 'last12') return weekly.slice(-12);
  return weekly;
}

function filterVideosByPeriodWeeks(videos, periodWeeks) {
  if (STATE.period === 'all') return videos;
  const validWeeks = new Set(periodWeeks.map(w => w.week_label));
  return videos.filter(v => validWeeks.has(v.week_label));
}

// ==============================================
// 5축 점수 계산
// ==============================================
function computePentagon(creator, weekly) {
  if (weekly.length === 0) {
    return { scores: [0,0,0,0,0], overall: 0, grade: 'none', raw: {} };
  }
  
  const subsBase = num(creator.subscribers_baseline);
  
  // ① 구독자 성장: sub_net 합 / 구독자 기반 × 100, 0.5%/기간 = 100점
  const totalNet = weekly.reduce((s, w) => s + w.sub_net, 0);
  const growthRate = subsBase > 0 ? (totalNet / subsBase) * 100 : 0;
  const growthScore = Math.max(0, Math.min(100, 50 + growthRate * 100));
  
  // ② 콘텐츠 공급: 주당 평균 + 공백 페널티 (주 3건 = 100점)
  const totalUploads = weekly.reduce((s, w) => s + w.uploads_total, 0);
  const avgPerWeek = totalUploads / weekly.length;
  const emptyWeeks = weekly.filter(w => w.uploads_total === 0).length;
  let supplyScore = Math.min(100, (avgPerWeek / 3) * 100);
  supplyScore = Math.max(0, supplyScore - emptyWeeks * 5);
  
  // ③ 콘텐츠 효율: avg_view_pct (40% = 100점)
  const validVP = weekly.filter(w => w.avg_view_pct > 0);
  const avgVP = validVP.length > 0 ? validVP.reduce((s, w) => s + w.avg_view_pct, 0) / validVP.length : 0;
  const effScore = Math.max(0, Math.min(100, (avgVP / 40) * 100));
  
  // ④ 인게이지먼트: engagement_rate (0.8% = 100점)
  const validER = weekly.filter(w => w.views > 0);
  const totalEng = validER.reduce((s, w) => s + w.comments + w.shares, 0);
  const totalViews = validER.reduce((s, w) => s + w.views, 0);
  const engRate = totalViews > 0 ? (totalEng / totalViews) * 100 : 0;
  const engScore = Math.max(0, Math.min(100, (engRate / 0.8) * 100));
  
  // ⑤ 충성도: returning_viewer_pct (50% = 100점, 없으면 SPV 프록시)
  const validRV = weekly.filter(w => w.returning_viewer_pct > 0);
  let loyaltyScore = 0;
  let loyaltyRaw = '데이터 없음';
  let loyaltyReal = false;
  if (validRV.length > 0) {
    const avgRV = validRV.reduce((s, w) => s + w.returning_viewer_pct, 0) / validRV.length;
    loyaltyScore = Math.max(0, Math.min(100, (avgRV / 50) * 100));
    loyaltyRaw = avgRV.toFixed(1) + '%';
    loyaltyReal = true;
  } else {
    // SPV 프록시 (sub_net/views × 100, 0.1% = 60점)
    const spv = totalViews > 0 ? (totalNet / totalViews) * 100 : 0;
    loyaltyScore = Math.max(0, Math.min(60, (spv / 0.1) * 60));
    loyaltyRaw = `SPV ${spv.toFixed(3)}%`;
  }
  
  const scores = [
    Math.round(growthScore),
    Math.round(supplyScore),
    Math.round(effScore),
    Math.round(engScore),
    Math.round(loyaltyScore),
  ];
  const overall = Math.round(scores.reduce((s,x) => s+x, 0) / 5);
  
  let grade;
  if (overall >= 70) grade = 'healthy';
  else if (overall >= 50) grade = 'watch';
  else grade = 'high';
  
  return {
    scores, overall, grade,
    raw: {
      growth: { rate: growthRate, total: totalNet, weeks: weekly.length },
      supply: { perWeek: avgPerWeek, total: totalUploads, empty: emptyWeeks },
      efficiency: { avgVP },
      engagement: { rate: engRate, total: totalEng, views: totalViews },
      loyalty: { raw: loyaltyRaw, real: loyaltyReal }
    }
  };
}

function renderDiagnosis(pent, creator) {
  const labels = ['구독 성장', '콘텐츠 공급', '콘텐츠 효율', '인게이지먼트', '충성도'];
  const indexed = pent.scores.map((s, i) => ({ s, name: labels[i] }));
  const sorted = [...indexed].sort((a, b) => a.s - b.s);
  const weakest = sorted.slice(0, 2);
  const strongest = sorted.slice(-2).reverse();
  
  let text = '';
  if (pent.overall >= 70) {
    text = `<strong>${strongest[0].name}(${strongest[0].s})</strong>·<strong>${strongest[1].name}(${strongest[1].s})</strong> 강점. <strong>${weakest[0].name}(${weakest[0].s})</strong> 보강 시 더 안정.`;
  } else if (pent.overall >= 50) {
    text = `<strong>${weakest[0].name}(${weakest[0].s})</strong>·<strong>${weakest[1].name}(${weakest[1].s})</strong> 점검 필요. 단기 개입 권장.`;
  } else {
    text = `<strong>${weakest[0].name}(${weakest[0].s})</strong> 영역 즉시 개입 필요. 종합 ${pent.overall}점 — 채널 체력 약화 단계.`;
  }
  
  const tag = { healthy: '진단 · HEALTHY', watch: '진단 · WATCH', high: '진단 · HIGH RISK' }[pent.grade];
  
  return `
    <section style="padding: 0 48px 36px;">
      <div class="diagnosis ${pent.grade}">
        <span class="diag-tag">${tag}</span>${text}
      </div>
    </section>
  `;
}

// ============ § 01 구독자 흐름 ============
function renderSubscriberFlow(weekly, periodLabel, periodRange) {
  const gained = weekly.reduce((s, w) => s + w.sub_gained, 0);
  const lost = weekly.reduce((s, w) => s + w.sub_lost, 0);
  const net = weekly.reduce((s, w) => s + w.sub_net, 0);
  const retainRate = gained > 0 ? ((gained - lost) / gained * 100) : 0;
  
  // gained가 0인 경우 안내
  const hasFlowData = gained > 0 || lost > 0;
  
  return `
    <section class="section">
      <div class="sec-head">
        <span class="sec-num">§ 01</span>
        <span class="sec-title">구독자 <em>흐름</em></span>
        <span class="sec-sub">${periodLabel} · ${periodRange}</span>
      </div>
      
      ${!hasFlowData ? `
        <div class="warn-banner">
          ⓘ sub_gained / sub_lost 값이 0입니다. YouTube Analytics API의 subscribersGained/subscribersLost 응답을 확인해주세요. sub_net만 표시됩니다.
        </div>
      ` : ''}
      
      <div class="flow-grid">
        <div class="flow-cell gained">
          <div class="flow-name">신규 구독 (Gained)</div>
          <div class="flow-val pos">+${fmt.num(gained)}</div>
          <div class="flow-sub">주당 평균 +${fmt.num(gained/weekly.length)}명</div>
        </div>
        <div class="flow-cell lost">
          <div class="flow-name">이탈 구독 (Lost)</div>
          <div class="flow-val neg">−${fmt.num(lost)}</div>
          <div class="flow-sub">주당 평균 −${fmt.num(lost/weekly.length)}명</div>
        </div>
        <div class="flow-cell net">
          <div class="flow-name">순증 (Net)</div>
          <div class="flow-val ${net >= 0 ? 'pos' : 'neg'}">${fmt.signed(net)}</div>
          <div class="flow-sub">${hasFlowData ? `유지율 ${retainRate.toFixed(1)}% · ` : ''}주당 평균 ${fmt.signed(net/weekly.length)}명</div>
        </div>
      </div>
      
      <div class="chart-grid-2">
        <div class="chart-card">
          <div class="chart-title">주차별 순증 추이</div>
          <div class="chart-sub">막대 · 4주 이동평균 라인</div>
          <div class="chart-legend">
            <span><span class="lg-dot" style="background:var(--blue);"></span>주간 순증</span>
            <span><span class="lg-dot" style="background:var(--orange);"></span>4주 이동평균</span>
          </div>
          <div class="chart-canvas tall"><canvas id="ch-sub"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">신규 vs 이탈 흐름</div>
          <div class="chart-sub">${hasFlowData ? '신규(양수) · 이탈(음수)' : 'gained/lost 데이터 부족 시 sub_net만 표시'}</div>
          <div class="chart-legend">
            <span><span class="lg-dot" style="background:var(--green);"></span>신규</span>
            <span><span class="lg-dot" style="background:var(--red);"></span>이탈</span>
          </div>
          <div class="chart-canvas tall"><canvas id="ch-flow"></canvas></div>
        </div>
      </div>
    </section>
  `;
}

// ============ § 03 롱폼 vs 숏폼 ============
function renderFormatSplit(weekly, videos) {
  const longViews = weekly.reduce((s, w) => s + w.views_long, 0);
  const shortViews = weekly.reduce((s, w) => s + w.views_short, 0);
  const longUploads = weekly.reduce((s, w) => s + w.uploads_long, 0);
  const shortUploads = weekly.reduce((s, w) => s + w.uploads_short, 0);
  
  const longVideos = videos.filter(v => v.video_type === 'long');
  const shortVideos = videos.filter(v => v.video_type === 'short');
  
  const longAvg = longUploads > 0 ? longViews / longUploads : 0;
  const shortAvg = shortUploads > 0 ? shortViews / shortUploads : 0;
  
  const longLikes = longVideos.reduce((s, v) => s + v.likes, 0);
  const longComments = longVideos.reduce((s, v) => s + v.comments, 0);
  const shortLikes = shortVideos.reduce((s, v) => s + v.likes, 0);
  const shortComments = shortVideos.reduce((s, v) => s + v.comments, 0);
  
  const longEngRate = longViews > 0 ? ((longLikes + longComments) / longViews * 100) : 0;
  const shortEngRate = shortViews > 0 ? ((shortLikes + shortComments) / shortViews * 100) : 0;
  
  return `
    <section class="section">
      <div class="sec-head">
        <span class="sec-num">§ 03</span>
        <span class="sec-title">롱폼 vs <em>숏폼</em></span>
        <span class="sec-sub">${videos.length}개 영상 · weekly 합계 + 영상 평균</span>
      </div>
      
      <div class="fmt-grid">
        <div class="fmt-cell">
          <div class="fmt-eyebrow">▶ LONG-FORM</div>
          <div class="fmt-name long">롱폼</div>
          ${[
            ['업로드', longUploads + '건', longUploads > shortUploads],
            ['총 조회', fmt.numK(longViews), longViews > shortViews],
            ['편당 평균 조회', fmt.numK(longAvg), longAvg > shortAvg],
            ['인게이지먼트율', longEngRate.toFixed(2) + '%', longEngRate > shortEngRate],
            ['총 좋아요', fmt.numK(longLikes), longLikes > shortLikes],
            ['총 댓글', fmt.numK(longComments), longComments > shortComments],
          ].map(([m, v, w]) => `
            <div class="fmt-row">
              <span class="metric">${m}</span>
              <span class="value">${v}${w ? '<span class="winner">HIGH</span>' : ''}</span>
            </div>
          `).join('')}
        </div>
        <div class="fmt-cell">
          <div class="fmt-eyebrow">⏵ SHORT-FORM</div>
          <div class="fmt-name short">숏폼</div>
          ${[
            ['업로드', shortUploads + '건', shortUploads > longUploads],
            ['총 조회', fmt.numK(shortViews), shortViews > longViews],
            ['편당 평균 조회', fmt.numK(shortAvg), shortAvg > longAvg],
            ['인게이지먼트율', shortEngRate.toFixed(2) + '%', shortEngRate > longEngRate],
            ['총 좋아요', fmt.numK(shortLikes), shortLikes > longLikes],
            ['총 댓글', fmt.numK(shortComments), shortComments > longComments],
          ].map(([m, v, w]) => `
            <div class="fmt-row">
              <span class="metric">${m}</span>
              <span class="value">${v}${w ? '<span class="winner">HIGH</span>' : ''}</span>
            </div>
          `).join('')}
        </div>
      </div>
      
      <div class="chart-grid-2" style="margin-top:24px;">
        <div class="chart-card">
          <div class="chart-title">조회수 비중 추이</div>
          <div class="chart-sub">롱폼 vs 숏폼 누적 조회</div>
          <div class="chart-canvas"><canvas id="ch-fmt-views"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">업로드 비중 추이</div>
          <div class="chart-sub">주차별 발행 빈도</div>
          <div class="chart-canvas"><canvas id="ch-fmt-uploads"></canvas></div>
        </div>
      </div>
    </section>
  `;
}

// ============ § 04 영상 랭킹 ============
let bwTab = 'views';
function renderVideoRanking(videos, periodLabel) {
  const valid = videos.filter(v => v.views > 0);
  
  if (valid.length === 0) {
    return `
      <section class="section">
        <div class="sec-head">
          <span class="sec-num">§ 04</span>
          <span class="sec-title">영상 <em>퍼포먼스 랭킹</em></span>
          <span class="sec-sub">${periodLabel}</span>
        </div>
        <div class="empty">해당 기간에 영상 데이터가 없습니다.</div>
      </section>
    `;
  }
  
  const metricLabel = {
    views: '조회수',
    engagement: '인게이지먼트율',
    likes: '좋아요',
  }[bwTab];
  
  const getVal = (v) => {
    if (bwTab === 'views') return v.views;
    if (bwTab === 'engagement') return v.views > 0 ? ((v.likes + v.comments) / v.views * 100) : 0;
    if (bwTab === 'likes') return v.likes;
    return 0;
  };
  
  const sorted = [...valid].sort((a, b) => getVal(b) - getVal(a));
  const top = sorted.slice(0, 10);
  const bottom = sorted.slice(-10).reverse();
  
  const fmtVal = (v) => {
    if (bwTab === 'engagement') return getVal(v).toFixed(2) + '%';
    return fmt.numK(getVal(v));
  };
  
  const renderRow = (v, i) => {
    const cls = v.video_type === 'long' ? 'long' : 'short';
    const tag = v.video_type === 'long' ? '▶ 롱폼' : '⏵ 숏폼';
    return `
      <tr>
        <td style="width:24px;color:var(--ink-mute);font-family:var(--mono);font-size:10px;">${i+1}</td>
        <td class="tag ${cls}">${tag}</td>
        <td class="title" title="${esc(v.title)}">${esc(v.title)}</td>
        <td style="font-family:var(--mono);font-size:10px;color:var(--ink-mute);width:80px;">${esc(v.week_label)}</td>
        <td class="num" style="width:80px;">${fmtVal(v)}</td>
      </tr>
    `;
  };
  
  return `
    <section class="section">
      <div class="sec-head">
        <span class="sec-num">§ 04</span>
        <span class="sec-title">영상 <em>퍼포먼스 랭킹</em></span>
        <span class="sec-sub">${periodLabel} · ${valid.length}개 영상</span>
      </div>
      
      <div class="bw-tabs">
        <button class="bw-tab ${bwTab === 'views' ? 'active' : ''}" onclick="window._setBW('views')">조회수</button>
        <button class="bw-tab ${bwTab === 'engagement' ? 'active' : ''}" onclick="window._setBW('engagement')">인게이지먼트율</button>
        <button class="bw-tab ${bwTab === 'likes' ? 'active' : ''}" onclick="window._setBW('likes')">좋아요</button>
      </div>
      
      <div class="bw-grid-split">
        <div class="bw-col best">
          <h4>▲ TOP 10 · ${metricLabel}</h4>
          <div class="tbl-scroll">
            <table class="tbl">
              <thead>
                <tr><th>#</th><th>유형</th><th>제목</th><th>주차</th><th class="num">${metricLabel}</th></tr>
              </thead>
              <tbody>${top.map((v, i) => renderRow(v, i)).join('')}</tbody>
            </table>
          </div>
        </div>
        <div class="bw-col worst">
          <h4>▼ BOTTOM 10 · ${metricLabel}</h4>
          <div class="tbl-scroll">
            <table class="tbl">
              <thead>
                <tr><th>#</th><th>유형</th><th>제목</th><th>주차</th><th class="num">${metricLabel}</th></tr>
              </thead>
              <tbody>${bottom.map((v, i) => renderRow(v, valid.length - bottom.length + i)).join('')}</tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  `;
}

window._setBW = (m) => {
  bwTab = m;
  renderDash();
};

// ==============================================
// CHARTS
// ==============================================
Chart.defaults.color = '#5a554d';
Chart.defaults.borderColor = '#e5e1d8';
Chart.defaults.font.family = 'JetBrains Mono, monospace';
Chart.defaults.font.size = 10;

function ma4(arr) {
  return arr.map((_, i) => {
    const slice = arr.slice(Math.max(0, i-3), i+1);
    return slice.reduce((s, x) => s + x, 0) / slice.length;
  });
}

function buildSubChart(weekly) {
  const ctx = document.getElementById('ch-sub');
  if (!ctx) return;
  const labels = weekly.map(w => w.week_label);
  const data = weekly.map(w => w.sub_net);
  const ma = ma4(data);
  
  charts.sub = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: '주간 순증',
          data,
          backgroundColor: data.map(v => v >= 0 ? 'rgba(24,95,165,0.75)' : 'rgba(185,28,28,0.75)'),
          borderColor: data.map(v => v >= 0 ? '#185FA5' : '#b91c1c'),
          borderWidth: 1,
          order: 2,
        },
        {
          type: 'line',
          label: '4주 MA',
          data: ma,
          borderColor: '#D85A30',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          tension: 0.3,
          pointRadius: 2,
          order: 1,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } },
        y: { grid: { color: 'rgba(229,225,216,0.6)' }, ticks: { callback: v => v >= 0 ? '+' + fmt.numK(v) : '−' + fmt.numK(Math.abs(v)) } }
      }
    }
  });
}

function buildFlowChart(weekly) {
  const ctx = document.getElementById('ch-flow');
  if (!ctx) return;
  const labels = weekly.map(w => w.week_label);
  const gained = weekly.map(w => w.sub_gained);
  const lost = weekly.map(w => -w.sub_lost);
  const hasGainedLost = gained.some(g => g > 0) || lost.some(l => l < 0);
  
  if (!hasGainedLost) {
    // sub_net만 표시
    charts.flow = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'sub_net',
          data: weekly.map(w => w.sub_net),
          borderColor: '#185FA5',
          backgroundColor: 'rgba(24,95,165,0.1)',
          tension: 0.3,
          fill: true,
          pointRadius: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } },
          y: { grid: { color: 'rgba(229,225,216,0.6)' }, ticks: { callback: v => fmt.signed(v) } }
        }
      }
    });
    return;
  }
  
  charts.flow = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: '신규',
          data: gained,
          backgroundColor: 'rgba(21,128,61,0.75)',
          borderColor: '#15803d',
          borderWidth: 1,
        },
        {
          label: '이탈',
          data: lost,
          backgroundColor: 'rgba(185,28,28,0.75)',
          borderColor: '#b91c1c',
          borderWidth: 1,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, stacked: true },
        y: { grid: { color: 'rgba(229,225,216,0.6)' }, ticks: { callback: v => v >= 0 ? '+' + fmt.numK(v) : '−' + fmt.numK(Math.abs(v)) }, stacked: true }
      }
    }
  });
}

// 평균 시청 비율 - 롱폼/숏폼 가중평균
// videos 시트의 영상별 데이터로 주차별 가중평균 계산
// 영상별 avg_view_pct가 없으면 weekly의 채널 평균만 회색 점선으로 표시
function buildVPChart(weekly, videos) {
  const ctx = document.getElementById('ch-vp');
  if (!ctx) return;
  const labels = weekly.map(w => w.week_label);
  
  // 주차별로 video_type별 가중평균 avg_view_pct 계산
  // 영상별 avg_view_pct가 없는 경우(현재 데이터 상태) → 해당 주차의 채널 avg_view_pct로 폴백
  const longVP = [];
  const shortVP = [];
  const channelVP = [];
  
  weekly.forEach(w => {
    const wkVideos = videos.filter(v => v.week_label === w.week_label);
    const longVids = wkVideos.filter(v => v.video_type === 'long');
    const shortVids = wkVideos.filter(v => v.video_type === 'short');
    
    // 영상별 avg_view_pct가 있는 경우 가중평균 시도
    // (현재 시트에는 영상별 avg_view_pct 컬럼 없음 → 채널 평균으로 폴백)
    const calcWeightedVP = (vids) => {
      const valid = vids.filter(v => v.avg_view_pct && v.views > 0);
      if (valid.length === 0) return null;
      const totalViews = valid.reduce((s, v) => s + v.views, 0);
      const weighted = valid.reduce((s, v) => s + (v.avg_view_pct * v.views), 0);
      return totalViews > 0 ? weighted / totalViews : null;
    };
    
    longVP.push(calcWeightedVP(longVids));
    shortVP.push(calcWeightedVP(shortVids));
    channelVP.push(w.avg_view_pct || null);
  });
  
  // 영상별 avg_view_pct가 전부 null이면 (현재 상태) → 채널 평균만 보여줌
  const hasLongData = longVP.some(v => v !== null);
  const hasShortData = shortVP.some(v => v !== null);
  
  const datasets = [];
  
  if (hasLongData) {
    datasets.push({
      label: '롱폼',
      data: longVP,
      borderColor: '#534AB7',
      backgroundColor: 'rgba(83,74,183,0.08)',
      tension: 0.3, borderWidth: 2, pointRadius: 3, fill: false, spanGaps: true,
    });
  }
  if (hasShortData) {
    datasets.push({
      label: '숏폼',
      data: shortVP,
      borderColor: '#D85A30',
      backgroundColor: 'rgba(216,90,48,0.08)',
      tension: 0.3, borderWidth: 2, pointRadius: 3, fill: false, spanGaps: true,
    });
  }
  
  // 채널 평균은 항상 표시 (참고선)
  datasets.push({
    label: '채널 평균',
    data: channelVP,
    borderColor: '#9c968a',
    backgroundColor: 'transparent',
    tension: 0.3, borderWidth: 1.5, pointRadius: 2, fill: false, 
    borderDash: [4, 3], spanGaps: true,
  });
  
  charts.vp = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { 
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => ctx.dataset.label + ': ' + (ctx.raw == null ? '데이터 없음' : ctx.raw.toFixed(1) + '%')
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } },
        y: { grid: { color: 'rgba(229,225,216,0.6)' }, ticks: { callback: v => v + '%' }, beginAtZero: true }
      }
    }
  });
}

// 인게이지먼트(좋아요/댓글/공유 절대값) - 전체/롱폼/숏폼 필터
let engFilter = 'all';

function buildEngagementChart(weekly, videos) {
  const ctx = document.getElementById('ch-eng');
  if (!ctx) return;
  
  // 필터 버튼 바인딩
  document.querySelectorAll('#eng-filter button').forEach(btn => {
    btn.onclick = () => {
      engFilter = btn.dataset.eng;
      document.querySelectorAll('#eng-filter button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // 차트만 다시 그림
      if (charts.eng) charts.eng.destroy();
      buildEngagementChart(weekly, videos);
    };
  });
  
  const labels = weekly.map(w => w.week_label);
  
  // 필터에 따라 데이터 계산
  let likes, comments, shares;
  
  if (engFilter === 'all') {
    // weekly 시트의 전체 값 사용
    likes = weekly.map(w => w.likes);
    comments = weekly.map(w => w.comments);
    shares = weekly.map(w => w.shares);
  } else {
    // videos 시트에서 video_type별 주차 합산
    const targetType = engFilter; // 'long' or 'short'
    likes = weekly.map(w => {
      const wkVids = videos.filter(v => v.week_label === w.week_label && v.video_type === targetType);
      return wkVids.reduce((s, v) => s + v.likes, 0);
    });
    comments = weekly.map(w => {
      const wkVids = videos.filter(v => v.week_label === w.week_label && v.video_type === targetType);
      return wkVids.reduce((s, v) => s + v.comments, 0);
    });
    shares = weekly.map(w => {
      const wkVids = videos.filter(v => v.week_label === w.week_label && v.video_type === targetType);
      return wkVids.reduce((s, v) => s + v.shares, 0);
    });
  }
  
  charts.eng = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: '좋아요',
          data: likes,
          borderColor: '#D4537E',
          backgroundColor: 'rgba(212,83,126,0.08)',
          tension: 0.3, borderWidth: 2, pointRadius: 3, fill: false,
        },
        {
          label: '댓글',
          data: comments,
          borderColor: '#185FA5',
          backgroundColor: 'rgba(24,95,165,0.08)',
          tension: 0.3, borderWidth: 2, pointRadius: 3, fill: false,
        },
        {
          label: '공유',
          data: shares,
          borderColor: '#1D9E75',
          backgroundColor: 'rgba(29,158,117,0.08)',
          tension: 0.3, borderWidth: 2, pointRadius: 3, fill: false,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { 
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => ctx.dataset.label + ': ' + fmt.num(ctx.raw)
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } },
        y: { grid: { color: 'rgba(229,225,216,0.6)' }, ticks: { callback: v => fmt.numK(v) }, beginAtZero: true }
      }
    }
  });
}

// ==============================================
// INIT
// ==============================================
async function init() {
  try {
    await loadData();
    if (DATA.masters.length === 0) throw new Error('creators_master 데이터 없음');
    
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    
    renderCreatorTabs();
    renderDash();
  } catch (err) {
    console.error('[Init failed]', err);
    const errMsg = err.message || String(err);
    let hint = '';
    if (errMsg.includes('Failed to fetch') || errMsg.includes('NetworkError')) {
      hint = `
        <div style="margin-top:20px;padding:14px 18px;background:var(--bg-soft);border-left:3px solid var(--red);text-align:left;max-width:560px;font-family:var(--sans);font-size:12.5px;line-height:1.7;color:var(--ink);">
          <strong>가능한 원인:</strong><br/>
          1. HTML을 <strong>로컬 파일(file://)</strong>로 직접 열었을 때 → 반드시 GitHub Pages 또는 로컬 서버로 열어주세요<br/>
          2. Google Sheets 게시(Publish to web) 설정이 풀렸을 가능성 → 파일 → 공유 → 웹에 게시 다시 확인<br/>
          3. 네트워크 차단 (회사 방화벽 등)<br/>
          <br/>
          <strong>확인 방법:</strong> 브라우저 F12 → Console 탭에서 정확한 에러 메시지 확인
        </div>
      `;
    }
    document.getElementById('loading').innerHTML = `
      <div class="title" style="color:var(--red);">로드 실패</div>
      <div class="sub" style="margin-top:8px;">${esc(errMsg)}</div>
      ${hint}
      <button onclick="location.reload()" style="margin-top:24px;padding:8px 20px;background:var(--ink);color:white;border:none;font-family:var(--mono);font-size:11px;letter-spacing:0.1em;cursor:pointer;">RETRY</button>
    `;
  }
}

init();

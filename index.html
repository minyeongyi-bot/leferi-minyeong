<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Performance LAB · v14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Pretendard:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #ffffff; --bg-soft: #faf9f6; --bg-card: #f5f3ed;
  --line: #e5e1d8; --line-soft: #efece4;
  --ink: #1a1815; --ink-soft: #5a554d; --ink-mute: #9c968a;
  --accent: #b8860b; --accent-bg: #faf3e3;
  --green: #15803d; --green-bg: #ecfdf5;
  --red: #b91c1c; --red-bg: #fee2e2;
  --amber: #d97706; --amber-bg: #fef3c7;
  --blue: #185FA5; --purple: #534AB7; --orange: #D85A30;
  --teal: #1D9E75; --pink: #D4537E;
  --serif: 'Fraunces', 'Pretendard', serif;
  --sans: 'Pretendard', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; }
#loading { position: fixed; inset: 0; background: var(--bg); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading .title { font-family: var(--serif); font-size: 26px; font-weight: 500; font-style: italic; letter-spacing: -0.02em; margin-bottom: 10px; }
#loading .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); letter-spacing: 0.12em; text-transform: uppercase; }
#loading .spinner { width: 32px; height: 32px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-top: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.masthead { border-bottom: 2px solid var(--ink); padding: 28px 48px 22px; display: flex; justify-content: space-between; align-items: flex-end; }
.eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-bottom: 6px; }
.masthead h1 { font-family: var(--serif); font-weight: 400; font-size: 32px; letter-spacing: -0.025em; font-style: italic; line-height: 1; }
.masthead h1 em { font-style: normal; font-weight: 600; }
.masthead-right { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); text-align: right; line-height: 1.7; }

/* v14 신규: 뷰 토글 */
.view-toggle { border-bottom: 1px solid var(--line); padding: 0 48px; display: flex; gap: 0; background: var(--bg); }
.vt-btn { background: transparent; border: none; font-family: var(--sans); font-size: 14px; font-weight: 500; padding: 16px 22px; cursor: pointer; color: var(--ink-mute); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: baseline; gap: 8px; letter-spacing: -0.01em; }
.vt-btn:hover { color: var(--ink); }
.vt-btn.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.vt-btn .vt-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; }
.vt-btn.active .vt-sub { color: var(--accent); }
.vt-icon { font-size: 13px; margin-right: 2px; color: var(--ink-mute); }
.vt-btn.active .vt-icon { color: var(--accent); }
.vt-meta { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-mute); letter-spacing: 0.05em; align-self: center; }

.controls { background: var(--bg-soft); border-bottom: 1px solid var(--line); padding: 14px 48px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ctrl-group { display: flex; align-items: center; gap: 10px; }
.ctrl-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); font-weight: 500; }
.ctrl-segment { display: inline-flex; border: 1px solid var(--ink); }
.ctrl-segment button { background: transparent; border: none; border-right: 1px solid var(--ink); font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; padding: 6px 12px; cursor: pointer; color: var(--ink); font-weight: 500; text-transform: uppercase; }
.ctrl-segment button:last-child { border-right: none; }
.ctrl-segment button:hover { background: var(--bg-card); }
.ctrl-segment button.active { background: var(--ink); color: var(--bg); font-weight: 600; }
/* 사용자지정 날짜 입력 */
.date-range { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
.date-range input[type="date"] { font-family: var(--mono); font-size: 11px; padding: 5px 8px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); letter-spacing: 0.02em; }
.date-range input[type="date"]:focus { outline: none; border-color: var(--accent); }
.date-range .sep { color: var(--ink-mute); padding: 0 2px; }
.date-range .apply-btn { background: var(--ink); color: var(--bg); border: none; font-family: var(--mono); font-size: 10px; padding: 6px 11px; letter-spacing: 0.12em; cursor: pointer; font-weight: 600; }
.date-range .apply-btn:hover { background: var(--accent); }
.date-range .reset-btn { background: transparent; color: var(--ink-mute); border: 1px solid var(--line); font-family: var(--mono); font-size: 10px; padding: 6px 9px; letter-spacing: 0.12em; cursor: pointer; }
.date-range .reset-btn:hover { color: var(--ink); border-color: var(--ink); }
.date-range-hint { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); letter-spacing: 0.05em; margin-left: 4px; }
.ctrl-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; color: var(--ink-mute); letter-spacing: 0.08em; }
.ctrl-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.hero { padding: 36px 48px 32px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; }
.hero-id { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.hero-label-pill { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; background: var(--ink); color: var(--bg); padding: 4px 10px; font-weight: 500; }
.hero-name { font-family: var(--serif); font-weight: 600; font-size: 34px; letter-spacing: -0.025em; line-height: 1; }
.hero-handle { font-family: var(--mono); font-size: 12px; color: var(--ink-mute); letter-spacing: 0.02em; }
.hero-stats { display: flex; gap: 28px; align-items: baseline; margin-top: 14px; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
.hero-stats .stat-val { color: var(--ink); font-weight: 600; font-size: 14px; font-family: var(--serif); margin-left: 6px; }
.health-block { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.health-eyebrow { font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-mute); }
.health-grade-row { display: flex; align-items: baseline; gap: 14px; }
.health-score { font-family: var(--serif); font-size: 72px; font-weight: 600; line-height: 1; letter-spacing: -0.04em; }
.health-score .max { font-family: var(--mono); font-size: 16px; color: var(--ink-mute); font-weight: 400; margin-left: 2px; }
.health-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; border: 1.5px solid; }
.health-badge.healthy { color: var(--green); border-color: var(--green); background: var(--green-bg); }
.health-badge.watch { color: var(--amber); border-color: var(--amber); background: var(--amber-bg); }
.health-badge.high { color: var(--red); border-color: var(--red); background: var(--red-bg); }
.health-badge .bdot { width: 7px; height: 7px; border-radius: 50%; }
.health-badge.healthy .bdot { background: var(--green); }
.health-badge.watch .bdot { background: var(--amber); }
.health-badge.high .bdot { background: var(--red); animation: pulse 1.5s infinite; }

/* v15: 5각 레이더 + 5축 세로 스택 패널 */
.pentagon-block { display: grid; grid-template-columns: minmax(380px, 0.85fr) 1.15fr; border-bottom: 1px solid var(--line); }
.pentagon-radar-wrap { padding: 28px 32px; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: stretch; background: var(--bg-soft); min-height: 480px; }
.pentagon-radar-title { font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-mute); font-weight: 500; margin-bottom: 10px; }
.pentagon-radar-canvas { flex: 1; min-height: 360px; position: relative; }
.pentagon-radar-canvas canvas { width: 100% !important; height: 100% !important; }
.pentagon-radar-note { font-family: var(--mono); font-size: 9px; color: var(--ink-mute); letter-spacing: 0.05em; margin-top: 10px; text-align: center; }

/* 5축 세로 스택 */
.pentagon-axes { display: flex; flex-direction: column; }
.pent-cell { padding: 18px 28px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto auto; gap: 4px 16px; align-items: baseline; }
.pent-cell:last-child { border-bottom: none; }
.pent-name { grid-column: 1; grid-row: 1; font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); font-weight: 600; }
.pent-score { grid-column: 2; grid-row: 1 / span 2; font-family: var(--serif); font-size: 36px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; align-self: center; }
.pent-score-max { font-size: 13px; color: var(--ink-mute); font-family: var(--mono); font-weight: 400; }
.pent-score.good { color: var(--green); } .pent-score.mid { color: var(--amber); } .pent-score.low { color: var(--red); }
.pent-desc { grid-column: 1; grid-row: 2; font-family: var(--sans); font-size: 12px; color: var(--ink-soft); line-height: 1.4; letter-spacing: -0.005em; }
.pent-bar { grid-column: 1 / span 2; grid-row: 3; margin-top: 8px; height: 3px; background: var(--bg-card); overflow: hidden; }
.pent-bar-fill { height: 100%; transition: width 0.6s ease; }
.pent-bar-fill.good { background: var(--green); } .pent-bar-fill.mid { background: var(--amber); } .pent-bar-fill.low { background: var(--red); }
.pent-sub { grid-column: 1 / span 2; grid-row: 4; font-family: var(--mono); font-size: 10px; color: var(--ink-mute); margin-top: 4px; line-height: 1.5; letter-spacing: 0.02em; }

.section { padding: 48px 48px; border-bottom: 1px solid var(--line); }
.sec-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sec-num { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; color: var(--accent); font-weight: 500; }
.sec-title { font-family: var(--serif); font-size: 26px; font-weight: 400; letter-spacing: -0.025em; font-style: italic; }
.sec-title em { font-style: normal; font-weight: 600; }
.sec-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); margin-left: auto; letter-spacing: 0.05em; }

.subkpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 28px; }
.subkpi { background: var(--bg); padding: 18px 22px; }
.subkpi-name { font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 8px; }
.subkpi-val { font-family: var(--serif); font-size: 26px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; }
.subkpi-val.pos { color: var(--green); } .subkpi-val.neg { color: var(--red); }
.subkpi-val .unit { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); font-weight: 400; margin-left: 3px; }
.subkpi-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin-top: 6px; }

.chart-card { background: var(--bg); border: 1px solid var(--line); padding: 22px 24px; }
.chart-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.chart-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
.chart-title { font-family: var(--serif); font-size: 15px; font-weight: 600; font-style: italic; margin-bottom: 3px; }
.chart-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); margin-bottom: 14px; }
.chart-canvas { position: relative; height: 240px; }
.chart-canvas.tall { height: 300px; }
.chart-canvas.short { height: 180px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 14px; font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin-bottom: 12px; }
.lg-dot { display: inline-block; width: 10px; height: 10px; border-radius: 1px; margin-right: 5px; vertical-align: middle; }

.flow-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 24px; }
.flow-cell { background: var(--bg); padding: 22px 26px; border-left: 3px solid transparent; }
.flow-cell.gained { border-left-color: var(--green); } .flow-cell.lost { border-left-color: var(--red); } .flow-cell.net { border-left-color: var(--ink); }
.flow-name { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 10px; }
.flow-val { font-family: var(--serif); font-size: 36px; font-weight: 500; line-height: 1; letter-spacing: -0.025em; }
.flow-val.pos { color: var(--green); } .flow-val.neg { color: var(--red); }
.flow-sub { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin-top: 8px; }

.fmt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.fmt-cell { background: var(--bg); padding: 26px 30px; }
.fmt-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 4px; }
.fmt-name { font-family: var(--serif); font-size: 28px; font-weight: 500; font-style: italic; letter-spacing: -0.025em; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
.fmt-name.long { color: var(--purple); } .fmt-name.short { color: var(--orange); }
.fmt-row { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.fmt-row:last-child { border-bottom: none; }
.fmt-row .metric { font-size: 12.5px; color: var(--ink-soft); }
.fmt-row .value { font-family: var(--mono); font-size: 14px; font-weight: 600; }
.fmt-row .winner { font-family: var(--mono); font-size: 9px; background: var(--ink); color: var(--bg); padding: 1px 5px; margin-left: 6px; letter-spacing: 0.12em; }

.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); text-align: left; padding: 10px 8px; border-bottom: 1.5px solid var(--ink); font-weight: 600; }
.tbl th.num { text-align: right; }
.tbl td { padding: 11px 8px; border-bottom: 1px solid var(--line-soft); color: var(--ink-soft); }
.tbl td.num { font-family: var(--mono); text-align: right; font-weight: 600; color: var(--ink); }
.tbl td.title { color: var(--ink); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl td.tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; font-weight: 600; text-transform: uppercase; }
.tbl td.tag.long { color: var(--purple); } .tbl td.tag.short { color: var(--orange); }
.tbl tr:hover td { background: var(--bg-soft); }
.tbl-scroll { max-height: 480px; overflow-y: auto; border: 1px solid var(--line); }
.tbl-scroll thead th { position: sticky; top: 0; background: var(--bg); z-index: 1; box-shadow: 0 1px 0 var(--ink); }

.bw-tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.bw-tab { background: transparent; border: none; font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 600; }
.bw-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.bw-grid-split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.bw-col h4 { font-family: var(--serif); font-size: 16px; font-style: italic; font-weight: 600; margin-bottom: 12px; }
.bw-col.best h4 { color: var(--green); } .bw-col.worst h4 { color: var(--red); }

/* v15.1: 오디언스 인구통계 블록 */
.demo-block { margin-top: 32px; padding-top: 28px; border-top: 1px solid var(--line); }
.demo-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 18px; }
.demo-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.demo-snapshot { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); letter-spacing: 0.05em; margin-left: auto; }
.demo-empty-msg { padding: 20px; background: var(--bg-soft); border: 1px dashed var(--line); font-family: var(--mono); font-size: 11px; color: var(--ink-mute); }
.demo-empty-msg code { font-family: var(--mono); background: var(--bg-card); padding: 2px 6px; color: var(--ink); }
.demo-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 28px; }
.demo-chart-wrap { background: var(--bg-soft); border: 1px solid var(--line); padding: 20px 24px; }
.demo-chart-title { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 14px; font-weight: 600; }
.demo-chart-canvas { height: 280px; position: relative; }
.demo-chart-canvas canvas { width: 100% !important; height: 100% !important; }
.demo-chart-legend { display: flex; gap: 20px; margin-top: 12px; font-family: var(--mono); font-size: 10px; color: var(--ink-soft); letter-spacing: 0.04em; }
.demo-kpi-wrap { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.demo-kpi { background: var(--bg); padding: 18px 22px; }
.demo-kpi-name { font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 8px; }
.demo-kpi-val { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.demo-kpi-sep { color: var(--ink-mute); font-weight: 400; margin: 0 4px; }
.demo-kpi-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin-top: 6px; letter-spacing: 0.02em; }
.demo-pink { color: var(--pink); }
.demo-blue { color: var(--blue); }
@media (max-width: 1024px) {
  .demo-grid { grid-template-columns: 1fr; }
  .demo-chart-canvas { height: 320px; }
}


.foot { padding: 32px 48px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--ink-mute); display: flex; justify-content: space-between; text-transform: uppercase; }
.empty { padding: 48px; text-align: center; color: var(--ink-mute); font-size: 13px; background: var(--bg-soft); border: 1px dashed var(--line); }
.warn-banner { background: var(--amber-bg); border: 1px solid var(--amber); border-left: 3px solid var(--amber); padding: 10px 14px; margin-bottom: 18px; font-size: 12px; color: #78350f; font-family: var(--mono); letter-spacing: 0.02em; }
.diagnosis { margin-top: 24px; padding: 16px 22px; background: var(--bg-soft); border-left: 3px solid var(--ink); font-family: var(--serif); font-size: 15px; font-style: italic; line-height: 1.6; }
.diagnosis.healthy { border-left-color: var(--green); } .diagnosis.watch { border-left-color: var(--amber); } .diagnosis.high { border-left-color: var(--red); }
.diag-tag { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; margin-right: 10px; font-style: normal; }
.diagnosis strong { font-weight: 600; font-style: normal; }

/* v14 §A 매트릭스 */
.matrix-wrap { border: 1px solid var(--line); background: var(--bg); margin-bottom: 18px; }
.matrix-table { width: 100%; border-collapse: collapse; }
.matrix-table thead th { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); font-weight: 600; text-align: center; padding: 12px 10px; border-bottom: 1.5px solid var(--ink); }
.matrix-table thead th.row-head { text-align: left; padding-left: 24px; width: 160px; }
.matrix-table tbody td { text-align: center; padding: 16px 10px; border-bottom: 1px solid var(--line-soft); font-family: var(--mono); vertical-align: middle; }
.matrix-table tbody tr:last-child td { border-bottom: none; }
.matrix-table tbody .tier-label { text-align: left; padding-left: 24px; font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink); }
.matrix-cell { position: relative; }

const fmt = {
  num: n => Math.round(n || 0).toLocaleString('ko-KR'),
  numK: n => {
    n = n || 0; const abs = Math.abs(n);
    if (abs >= 1e8) return (n/1e8).toFixed(2) + '억';
    if (abs >= 1e4) return Math.round(n/1e4) + '만';
    if (abs >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return Math.round(n).toString();
  },
  pct: (n, d=2) => (n||0).toFixed(d) + '%',
  signed: n => (n>=0?'+':'') + Math.round(n||0).toLocaleString('ko-KR'),
  subsMan: n => {
    if (n >= 100) return (n/100).toFixed(1).replace(/\.0$/,'') + '백만';
    if (n >= 1) return n.toFixed(1).replace(/\.0$/,'') + '만';
    return (n * 10).toFixed(1).replace(/\.0$/,'') + '천';
  },
  rev: n => {
    if (!n || n === 0) return '—';
    if (n >= 1) return n.toFixed(1).replace(/\.0$/,'') + '억';
    return Math.round(n * 100) + '백만';
  },
};

const esc = (s) => {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
};

function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], nx = text[i+1];
    if (inQ) {
      if (ch === '"' && nx === '"') { field += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { field += ch; }
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\r') {}
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += ch; }
    }
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

function csvToObjects(text) {
  const rows = parseCSV(text).filter(r => r.length > 0 && r.some(c => c !== ''));
  if (rows.length < 1) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i] !== undefined ? r[i] : '').trim());
    return obj;
  });
}

const num = v => {
  if (v === '' || v == null) return 0;
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
};

function dateToWeekLabel(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  const month = d.getMonth() + 1;
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const firstDay = first.getDay() === 0 ? 7 : first.getDay();
  const firstMondayDate = firstDay === 1 ? 1 : (1 + (8 - firstDay));
  const dayOfMonth = d.getDate();
  if (dayOfMonth < firstMondayDate) {
    const prev = new Date(d.getFullYear(), d.getMonth(), 0);
    const fmtFn = pd => pd.getFullYear() + '-' + String(pd.getMonth()+1).padStart(2,'0') + '-' + String(pd.getDate()).padStart(2,'0');
    return dateToWeekLabel(fmtFn(prev));
  }
  const weekOfMonth = Math.floor((dayOfMonth - firstMondayDate) / 7) + 1;
  return month + '월 ' + weekOfMonth + '주';
}

async function fetchCSV(url, name) {
  try {
    const r = await fetch(url, { mode: 'cors', cache: 'no-cache' });
    if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
    const text = await r.text();
    if (!text || text.trim().length === 0) throw new Error(`${name}: 빈 응답`);
    if (text.trim().startsWith('<')) throw new Error(`${name}: HTML 응답 받음 (게시 권한 확인)`);
    return text;
  } catch (err) {
    console.error(`[Fetch failed: ${name}]`, err);
    throw err;
  }
}

async function loadData() {
  const [m, w, v] = await Promise.all([
    fetchCSV(SHEET_URLS.creators_master, 'creators_master'),

      console.warn('       응답된 컬럼:', parsed.length > 0 ? Object.keys(parsed[0]) : '(빈 데이터)');

    if (to && w.week_start > to) return false;

  });

// ==============================================
// v15 신규: 5축 점수 계산 (분위수 기반)
// 산식 정책: B(최근 12주 분포 기준) + b(p75=100점) + 축1 가중 70:30
// ----------------------------------------------
// percentileScore(value, p25, p75):
//   value >= p75               → 100점
//   p25 ≤ value < p75          → 50 + (value-p25)/(p75-p25) * 50  [선형]
//   0 ≤ value < p25            → (value/p25) * 50                 [선형]
//   value < 0                  → 0점
// ==============================================
function percentileScore(value, p25, p75) {
  if (!isFinite(value)) return 0;
  if (p75 <= p25) {
    // 임계값 동일 시 단순 cap
    return value >= p75 ? 100 : (value >= 0 ? (value / p75) * 100 : 0);
  }
  if (value >= p75) return 100;
  if (value >= p25) return 50 + (value - p25) / (p75 - p25) * 50;
  if (value >= 0)   return p25 > 0 ? (value / p25) * 50 : 0;
  return 0;
}

// 분위수 헬퍼 (선형 보간, pandas/Sheet PERCENTILE 호환)
function quantile(sortedArr, q) {
  if (!sortedArr.length) return 0;
  if (sortedArr.length === 1) return sortedArr[0];
  const pos = (sortedArr.length - 1) * q;
  const base = Math.floor(pos);
  const rest = pos - base;
  if (base + 1 < sortedArr.length) {
    return sortedArr[base] + rest * (sortedArr[base + 1] - sortedArr[base]);
  }
  return sortedArr[base];
}

// 최근 N주 기준 임계값 계산
// 데이터가 12주 미만이면 전체 사용, 그 이상이면 마지막 12주
function getThresholds(weekly) {
  const N = 12;
  const base = weekly.length >= N ? weekly.slice(-N) : weekly;
  const sortAsc = (a, b) => a - b;
  const pull = (fn) => base.map(fn).filter(v => isFinite(v)).sort(sortAsc);

  const sub_net   = pull(w => w.sub_net);
  const retention = pull(w => w.sub_gained > 0 ? (w.sub_gained - (w.sub_lost || 0)) / w.sub_gained * 100 : 0);
  const uploads   = pull(w => w.uploads_total);
  const vp        = pull(w => w.avg_view_pct).filter(v => v > 0);
  const eng       = pull(w => w.views > 0 ? (((w.likes||0) + w.comments + w.shares) / w.views) * 100 : 0);
  const rv        = pull(w => w.returning_viewer_pct).filter(v => v > 0);

  return {
    sub_net:   { p25: quantile(sub_net, 0.25),   p75: quantile(sub_net, 0.75) },
    retention: { p25: quantile(retention, 0.25), p75: quantile(retention, 0.75) },
    uploads:   { p25: quantile(uploads, 0.25),   p75: quantile(uploads, 0.75) },
    vp:        { p25: quantile(vp, 0.25),        p75: quantile(vp, 0.75) },
    eng:       { p25: quantile(eng, 0.25),       p75: quantile(eng, 0.75) },
    rv:        { p25: quantile(rv, 0.25),        p75: quantile(rv, 0.75) },
    baseWeeks: base.length
  };
}

function computePentagon(creator, weekly) {
  if (weekly.length === 0) return { scores: [0,0,0,0,0], overall: 0, grade: 'none', raw: {}, thresholds: null };

  const TH = getThresholds(weekly);

  // 표시기간(weekly 전체) 평균 raw 값
  const totalNet = weekly.reduce((s, w) => s + w.sub_net, 0);
  const avgSubNet = totalNet / weekly.length;

  const retArr = weekly.map(w => w.sub_gained > 0 ? (w.sub_gained - (w.sub_lost || 0)) / w.sub_gained * 100 : 0);
  const avgRetention = retArr.reduce((s,x) => s+x, 0) / retArr.length;

  const totalUploads = weekly.reduce((s, w) => s + w.uploads_total, 0);
  const avgUploads = totalUploads / weekly.length;
  const emptyWeeks = weekly.filter(w => w.uploads_total === 0).length;

  const validVP = weekly.filter(w => w.avg_view_pct > 0);
  const avgVP = validVP.length > 0 ? validVP.reduce((s, w) => s + w.avg_view_pct, 0) / validVP.length : 0;

  const validER = weekly.filter(w => w.views > 0);
  const totalEng = validER.reduce((s, w) => s + (w.likes||0) + w.comments + w.shares, 0);
  const totalViews = validER.reduce((s, w) => s + w.views, 0);
  const engRate = totalViews > 0 ? (totalEng / totalViews) * 100 : 0;

  const validRV = weekly.filter(w => w.returning_viewer_pct > 0);
  const hasRV = validRV.length > 0;
  const avgRV = hasRV ? validRV.reduce((s, w) => s + w.returning_viewer_pct, 0) / validRV.length : 0;

  // 점수 계산
  const s_subnet    = percentileScore(avgSubNet,    TH.sub_net.p25,   TH.sub_net.p75);
  const s_retention = percentileScore(avgRetention, TH.retention.p25, TH.retention.p75);
  const growthScore = s_subnet * 0.7 + s_retention * 0.3;

  let supplyScore = percentileScore(avgUploads, TH.uploads.p25, TH.uploads.p75);
  supplyScore = Math.max(0, supplyScore - emptyWeeks * 5);

  const effScore = percentileScore(avgVP, TH.vp.p25, TH.vp.p75);
  const engScore = percentileScore(engRate, TH.eng.p25, TH.eng.p75);

  let loyaltyScore = 0, loyaltyRaw = '데이터 없음', loyaltyReal = false;
  if (hasRV) {
    loyaltyScore = percentileScore(avgRV, TH.rv.p25, TH.rv.p75);
    loyaltyRaw = avgRV.toFixed(1) + '%';
    loyaltyReal = true;
  } else {
    const spv = totalViews > 0 ? (totalNet / totalViews) * 100 : 0;
    loyaltyScore = Math.max(0, Math.min(60, (spv / 0.1) * 60));
    loyaltyRaw = `SPV ${spv.toFixed(3)}%`;
  }

  const scores = [
    Math.round(growthScore),
    Math.round(supplyScore),
    Math.round(effScore),
    Math.round(engScore),
    Math.round(loyaltyScore)
  ];
  const overall = Math.round(scores.reduce((s,x) => s+x, 0) / 5);

  let grade;
  if (overall >= 70) grade = 'healthy';
  else if (overall >= 50) grade = 'watch';
  else grade = 'high';

  return {
    scores, overall, grade,
    raw: {
      growth: {
        rate: 0, total: totalNet, weeks: weekly.length,
        avgSubNet, avgRetention,
        subnetScore: Math.round(s_subnet),
        retentionScore: Math.round(s_retention)
      },
      supply: { perWeek: avgUploads, total: totalUploads, empty: emptyWeeks },
      efficiency: { avgVP },
      engagement: { rate: engRate, total: totalEng, views: totalViews },
      loyalty: { raw: loyaltyRaw, real: loyaltyReal, avgRV }
    },
    thresholds: TH
  };
}

function findMasterByName(name) {
  return DATA.masters.find(m => {
    const mname = m.name_ko || '';
    return mname === name || mname.includes(name) || name.includes(mname);
  });
}

function getAugmentedRoster() {
  const out = [];
  ALL_LABELS.forEach(label => {
    (ROSTER[label] || []).forEach(name => {
      const tier = TIER_BY_NAME[name] || '미상';
      const master = findMasterByName(name);
      let hasData = false; let healthGrade = null;
      if (master) {
        const weekly = getCreatorWeekly(master);
        hasData = weekly.length > 0;
        if (hasData) {
          const pent = computePentagon(master, weekly);
          healthGrade = pent.grade;
        }
      }
      out.push({
        name, label, tier, hasData, master, healthGrade,
        score: SCORE_BY_NAME[name] || 0,
        subs: SUBS_BY_NAME[name] || 0,
        revenue: REVENUE_BY_NAME[name] || 0,
      });
    });
  });
  return out;
}

function computeMatrix() {
  const roster = getAugmentedRoster();
  const cells = {};
  TIERS.forEach(t => {
    cells[t] = {};
    ALL_LABELS.forEach(l => { cells[t][l] = { count: 0, dataCount: 0, members: [], status: null }; });
  });
  roster.forEach(p => {
    if (p.tier === '미상' || !cells[p.tier]) return;
    const cell = cells[p.tier][p.label]; if (!cell) return;
    cell.count++; cell.members.push(p);
    if (p.hasData) cell.dataCount++;
  });
  Object.values(cells).forEach(rowCells => {
    Object.values(rowCells).forEach(cell => {
      if (cell.dataCount === 0) { cell.status = null; return; }
      const grades = cell.members.filter(m => m.hasData).map(m => m.healthGrade);
      if (grades.includes('high')) cell.status = 'high';
      else if (grades.includes('watch')) cell.status = 'watch';
      else cell.status = 'healthy';
    });
  });
  return { cells, roster };
}

function renderTierRankingSection() {
  const { cells } = computeMatrix();
  const tierCounts = {};
  TIERS.forEach(t => { tierCounts[t] = ALL_LABELS.reduce((s, l) => s + cells[t][l].count, 0); });
  const tier = STATE.tierFilter;
  const ovP = STATE.overviewPeriod; // 'all' | 'last4' | 'last8' | 'last12' | 'custom'
  const periodLabel = getPeriodLabel(ovP, STATE.overviewCustom);
  const periodWeeks = ovP === 'last4' ? 4 : ovP === 'last8' ? 8 : ovP === 'last12' ? 12 : null;
  const isCustom = ovP === 'custom' && STATE.overviewCustom;

  const members = [];
  ALL_LABELS.forEach(l => { cells[tier][l].members.forEach(m => members.push(m)); });

  // 각 멤버에 대해 선택 기간 기준 지표 계산
  members.forEach(m => {
    if (!m.hasData) {
      m._stats = null; return;
    }
    const allWeekly = getCreatorWeekly(m.master);
    let wk;
    if (isCustom) {
      wk = filterWeeklyByDateRange(allWeekly, STATE.overviewCustom.from, STATE.overviewCustom.to);
    } else {
      wk = periodWeeks ? allWeekly.slice(-periodWeeks) : allWeekly;
    }
    if (wk.length === 0) { m._stats = null; return; }

    // 현재 구독자: 가장 최근 주의 subscribers (없으면 baseline + 누적 net)
    const latestSubs = wk[wk.length - 1].subscribers ||
                        (num(m.master.subscribers_baseline) + allWeekly.reduce((s, w) => s + w.sub_net, 0));
    const totalNet = wk.reduce((s, w) => s + w.sub_net, 0);
    const weeks = wk.length;
    const avgPerWeek = totalNet / weeks;
    const totalUploads = wk.reduce((s, w) => s + w.uploads_total, 0);
    const totalEng = wk.reduce((s, w) => s + w.likes + w.comments + w.shares, 0);

    // 직전 동일 기간 대비 비교 (기간 필터 켜진 경우만)
    let prevTotalNet = null;
    if (periodWeeks && allWeekly.length >= periodWeeks * 2) {
      const prev = allWeekly.slice(-periodWeeks * 2, -periodWeeks);
      prevTotalNet = prev.reduce((s, w) => s + w.sub_net, 0);
    } else if (isCustom && wk.length > 0) {
      // 같은 길이의 직전 기간 추출 (week_start 기준)
      const wkStartIdx = allWeekly.findIndex(w => w.week_start === wk[0].week_start);
      if (wkStartIdx >= wk.length) {
        const prev = allWeekly.slice(wkStartIdx - wk.length, wkStartIdx);
        prevTotalNet = prev.reduce((s, w) => s + w.sub_net, 0);
      }
    }
    let deltaPct = null;
    if (prevTotalNet !== null && Math.abs(prevTotalNet) > 0) {
      deltaPct = ((totalNet - prevTotalNet) / Math.abs(prevTotalNet)) * 100;
    }

    m._stats = { latestSubs, totalNet, avgPerWeek, weeks, totalUploads, totalEng, deltaPct };
  });

  // 정렬: 데이터 없는 사람은 항상 맨 아래, 그 외엔 선택된 키 기준
  const LABEL_ORDER = { 'DAEAD': 0, 'LBE': 1, 'Caape': 2, 'Le.dinary': 3, '더넥스트레이블': 4 };
  const STATUS_ORDER = { 'high': 0, 'watch': 1, 'healthy': 2 };  // 위험이 위로
  members.sort((a, b) => {
    if (a.hasData && !b.hasData) return -1;
    if (!a.hasData && b.hasData) return 1;

    const dir = STATE.rankSortDir === 'desc' ? -1 : 1;
    let cmp = 0;
    if (STATE.rankSortKey === 'growth') {
      cmp = a.hasData ? (a._stats.totalNet - b._stats.totalNet) : (a.score - b.score);
    } else if (STATE.rankSortKey === 'label') {
      cmp = (LABEL_ORDER[a.label] ?? 99) - (LABEL_ORDER[b.label] ?? 99);
    } else if (STATE.rankSortKey === 'subs') {
      const aS = a.hasData ? a._stats.latestSubs : (a.subs * 10000);
      const bS = b.hasData ? b._stats.latestSubs : (b.subs * 10000);
      cmp = aS - bS;
    } else if (STATE.rankSortKey === 'status') {
      cmp = (STATUS_ORDER[a.healthGrade] ?? 99) - (STATUS_ORDER[b.healthGrade] ?? 99);
    }
    return cmp * dir;
  });

  const rows = members.map((m, i) => {
    const rankClass = i === 0 ? '' : i === 1 ? 'rk-2' : i === 2 ? 'rk-3' : 'rk-rest';
    if (!m.hasData) {
      return `<tr>
        <td class="rank-num"><span class="${rankClass}">${i+1}</span></td>
        <td class="rank-creator">${esc(m.name)}</td>
        <td class="rank-label">${esc(m.label)}</td>
        <td class="rank-num-val" style="color:var(--ink-soft);">${m.subs > 0 ? fmt.subsMan(m.subs) : '—'}</td>
        <td><span style="color:var(--ink-mute);font-family:var(--mono);font-size:11px;">데이터 대기</span></td>
        <td><span style="color:var(--ink-mute);font-family:var(--mono);font-size:11px;">—</span></td>
        <td><span style="color:var(--ink-mute);font-family:var(--mono);font-size:11px;">—</span></td>
        <td><span style="color:var(--ink-mute);font-family:var(--mono);font-size:11px;">—</span></td>
        <td><span class="rank-status-pill nodata">대기</span></td>
      </tr>`;
    }
    const s = m._stats;
    const subsCell = `<span class="rank-num-val" style="color:var(--ink);">${fmt.subsMan(s.latestSubs / 10000)}</span>`;
    const netSign = s.totalNet >= 0 ? '+' : '';
    const netCls = s.totalNet >= 0 ? 'pos' : 'neg';
    let netMain = `<span class="rank-num-val ${netCls}">${netSign}${fmt.num(s.totalNet)}</span>`;
    if (s.deltaPct !== null) {
      const dSign = s.deltaPct >= 0 ? '+' : '';
      const dCls = s.deltaPct >= 0 ? 'pos' : 'neg';
      netMain += `<div style="font-family:var(--mono);font-size:10px;color:${s.deltaPct >= 0 ? 'var(--green)' : 'var(--red)'};margin-top:2px;">${dSign}${s.deltaPct.toFixed(0)}% vs 직전</div>`;
    }
    const avgSign = s.avgPerWeek >= 0 ? '+' : '';
    const avgCls = s.avgPerWeek >= 0 ? 'pos' : 'neg';
    const avgCell = `<span class="rank-num-val ${avgCls}">${avgSign}${fmt.num(s.avgPerWeek)}<span style="font-size:10px;color:var(--ink-mute);font-weight:400;">/주</span></span>`;
    const upCell = `<span class="rank-num-val" style="color:var(--ink);">${s.totalUploads}<span style="font-size:10px;color:var(--ink-mute);font-weight:400;">건</span></span>`;
    const engCell = `<span class="rank-num-val" style="color:var(--ink);">${fmt.numK(s.totalEng)}</span>`;
    const label = m.healthGrade === 'healthy' ? '안전' : m.healthGrade === 'watch' ? '주의' : '위험';
    const statusCell = `<span class="rank-status-pill ${m.healthGrade}">${label}</span>`;
    return `<tr>
      <td class="rank-num"><span class="${rankClass}">${i+1}</span></td>
      <td class="rank-creator" style="cursor:pointer;" onclick="window._jumpToDetail('${esc(m.name)}')">${esc(m.name)} <span style="font-family:var(--mono);font-size:9px;color:var(--accent);margin-left:4px;letter-spacing:0.1em;">→</span></td>
      <td class="rank-label">${esc(m.label)}</td>
      <td>${subsCell}</td>
      <td>${netMain}</td>
      <td>${avgCell}</td>
      <td>${upCell}</td>
      <td>${engCell}</td>
      <td>${statusCell}</td>
    </tr>`;
  }).join('');

  const tabsHtml = TIERS.map(t => {
    const active = STATE.tierFilter === t ? 'active' : '';
    const dis = tierCounts[t] === 0 ? 'disabled' : '';
    return `<button class="tier-tab ${active}" ${dis} onclick="window._setTier('${esc(t)}')">${esc(t)} <span class="count">${tierCounts[t]}명</span></button>`;
  }).join('');

  const periodTabsHtml = ['all', 'last4', 'last8', 'last12', 'custom'].map(p => {
    const lbl = { all: '전체', last4: '최근 4주', last8: '8주', last12: '12주', custom: '사용자지정' }[p];
    const active = STATE.overviewPeriod === p ? 'active' : '';
    return `<button class="${active}" onclick="window._setOvPeriod('${p}')">${lbl}</button>`;
  }).join('');

  // §B 사용자지정 데이터 범위 계산 (데이터 있는 멤버 전체 범위의 최소~최대)
  let ovDataRange = null;
  if (isCustom || STATE.overviewPeriod === 'custom') {
    const allDates = [];
    members.forEach(m => {
      if (m.hasData) {
        const wk = getCreatorWeekly(m.master);
        wk.forEach(w => { if (w.week_start) allDates.push(w.week_start); });
      }
    });
    if (allDates.length > 0) {
      allDates.sort();
      ovDataRange = { min: allDates[0], max: allDates[allDates.length - 1] };
    }
  }

  const ovCustomUI = STATE.overviewPeriod === 'custom' ? `
    <div class="date-range" style="margin-left:14px;">
      <input type="date" id="ov-from" value="${STATE.overviewCustom?.from || (ovDataRange?.min || '')}" />
      <span class="sep">~</span>
      <input type="date" id="ov-to" value="${STATE.overviewCustom?.to || (ovDataRange?.max || '')}" />
      <button class="apply-btn" onclick="window._applyOvCustom()">적용</button>
      <button class="reset-btn" onclick="window._resetOvPeriod()">초기화</button>
      ${ovDataRange ? `<span class="date-range-hint">데이터 범위: ${ovDataRange.min} ~ ${ovDataRange.max}</span>` : ''}
    </div>` : '';

  return `
    <section class="section">
      <div class="sec-head">
        <span class="sec-num">§ B · TIER RANKING</span>
        <span class="sec-title">등급별 <em>랭킹</em></span>
        <span class="sec-sub">${periodLabel} · 동일 체급끼리 비교</span>
      </div>
      <div class="tier-tabs">${tabsHtml}</div>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;">
        <span class="ctrl-label">Period</span>
        <div class="ctrl-segment" id="ov-period-tabs">${periodTabsHtml}</div>
        ${ovCustomUI}
        ${(!isCustom && periodWeeks) ? `<span style="font-family:var(--mono);font-size:10px;color:var(--ink-mute);letter-spacing:0.05em;">기간 합계 + 주당 평균 표시 · 직전 ${periodWeeks}주와 비교</span>` : ''}
        ${(!isCustom && !periodWeeks) ? `<span style="font-family:var(--mono);font-size:10px;color:var(--ink-mute);letter-spacing:0.05em;">누적 합계 표시</span>` : ''}
      </div>
      ${members.length === 0 ? `<div class="empty">${esc(tier)} 등급에 해당하는 크리에이터가 없습니다.</div>` : `
      <div style="border:1px solid var(--line);overflow-x:auto;">
        <table class="rank-table" style="min-width:880px;">
          <thead>
            <tr>
              <th style="width:44px;">#</th>
              <th>크리에이터</th>
              <th style="width:110px;cursor:pointer;user-select:none;" onclick="window._setRankSort('label')">레이블 ${STATE.rankSortKey === 'label' ? (STATE.rankSortDir === 'desc' ? '↓' : '↑') : '⇅'}</th>
              <th class="num" style="width:80px;cursor:pointer;user-select:none;" onclick="window._setRankSort('subs')">구독자 ${STATE.rankSortKey === 'subs' ? (STATE.rankSortDir === 'desc' ? '↓' : '↑') : '⇅'}</th>
              <th class="num" style="width:120px;cursor:pointer;user-select:none;" onclick="window._setRankSort('growth')">기간 순증 ${STATE.rankSortKey === 'growth' ? (STATE.rankSortDir === 'desc' ? '↓' : '↑') : '⇅'}</th>
              <th class="num" style="width:90px;">주당 평균</th>
              <th class="num" style="width:80px;">업로드</th>
              <th class="num" style="width:90px;">인게이지먼트</th>
              <th style="width:72px;cursor:pointer;user-select:none;" onclick="window._setRankSort('status')">상태 ${STATE.rankSortKey === 'status' ? (STATE.rankSortDir === 'desc' ? '↓' : '↑') : '⇅'}</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`}
    </section>
  `;
}

window._setRankSort = (key) => {
  if (STATE.rankSortKey === key) {
    // 같은 컬럼 다시 클릭 → 방향 토글
    STATE.rankSortDir = STATE.rankSortDir === 'desc' ? 'asc' : 'desc';
  } else {
    STATE.rankSortKey = key;
    // 새 컬럼 클릭 시 기본 방향: 텍스트는 오름차순, 숫자/상태는 내림차순
    STATE.rankSortDir = (key === 'label') ? 'asc' : 'desc';
  }
  renderOverview();
};

window._setOvPeriod = (p) => {
  STATE.overviewPeriod = p;
  if (p !== 'custom') STATE.overviewCustom = null;
  renderOverview();
};
window._applyOvCustom = () => {
  const from = document.getElementById('ov-from').value || null;
  const to = document.getElementById('ov-to').value || null;
  if (!from && !to) { alert('시작일 또는 종료일을 입력해주세요.'); return; }
  if (from && to && from > to) { alert('시작일이 종료일보다 늦을 수 없습니다.'); return; }
  STATE.overviewCustom = { from, to };
  STATE.overviewPeriod = 'custom';
  renderOverview();
};
window._resetOvPeriod = () => {
  STATE.overviewPeriod = 'all';
  STATE.overviewCustom = null;
  renderOverview();
};

  const html = `
    <div class="mat-modal-head">
      <div>
        <div class="mat-modal-meta">${esc(label)} · ${esc(tier)}</div>
        <div class="mat-modal-title">${cell.count}명 크리에이터</div>
      </div>
      <button class="mat-modal-close" onclick="window._closeMatModal()">CLOSE ✕</button>
    </div>
    <div>
      ${sortedMembers.map(m => {
        const clickable = m.hasData ? `onclick="window._jumpToDetail('${esc(m.name)}')" style="cursor:pointer;"` : '';
        const hoverHint = m.hasData ? '<span style="font-family:var(--mono);font-size:9px;color:var(--accent);margin-left:6px;letter-spacing:0.1em;">→ 상세</span>' : '';
        return `
        <div class="mat-modal-row" ${clickable}>
          <div>
            <div class="name">${esc(m.name)}${hoverHint}</div>
            <div style="font-family:var(--mono);font-size:10px;color:var(--ink-mute);margin-top:2px;">스코어 ${m.score.toFixed(1)}</div>
          </div>
          <div class="sub">${m.subs > 0 ? fmt.subsMan(m.subs) : '—'}</div>
          <div class="rev">${fmt.rev(m.revenue)}</div>
          <div><span class="badge ${m.hasData ? 'data' : 'wait'}">${m.hasData ? 'DATA' : '대기'}</span></div>
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--ink-mute);display:flex;justify-content:space-between;">
      <span>좌→우: 이름·스코어 · 구독자 · 2025 매출 · 데이터 상태</span>
      <span>DATA 표시된 행 클릭 → 상세 이동</span>
    </div>
  `;
  document.getElementById('mat-modal-inner').innerHTML = html;
  document.getElementById('mat-modal').classList.add('show');
};

window._closeMatModal = () => { document.getElementById('mat-modal').classList.remove('show'); };
window._setTier = (t) => { STATE.tierFilter = t; renderOverview(); };

// 매트릭스 셀(1명) 또는 모달 멤버 이름 클릭 → 상세 뷰로 점프
window._jumpToDetail = (name) => {
  const idx = DATA.masters.findIndex(m => {
    const mname = m.name_ko || '';
    return mname === name || mname.includes(name) || name.includes(mname);
  });
  if (idx === -1) {
    alert(`"${name}" 채널 데이터가 아직 시트에 없습니다.\n해당 채널의 weekly_metrics가 입력되면 상세 뷰로 이동할 수 있습니다.`);
    return;
  }
  STATE.creatorIdx = idx;
  window._closeMatModal();
  setView('detail');
  renderCreatorTabs();
};

// ==============================================
// 뷰 전환
// ==============================================
function setView(view) {
  STATE.view = view;
  document.querySelectorAll('.vt-btn').forEach(b => { b.classList.toggle('active', b.dataset.view === view); });
  if (view === 'overview') {
    document.getElementById('overview-view').style.display = '';
    document.getElementById('dash').style.display = 'none';
    document.getElementById('detail-controls').style.display = 'none';
    renderOverview();
  } else {
    document.getElementById('overview-view').style.display = 'none';
    document.getElementById('dash').style.display = '';
    document.getElementById('detail-controls').style.display = '';
    renderDash();
  }
}

// ==============================================
// Creator Tabs
// ==============================================
function renderCreatorTabs() {
  const wrap = document.getElementById('creator-tabs');
  if (DATA.masters.length === 0) {
    wrap.innerHTML = '<span style="font-family:var(--mono);font-size:10px;color:var(--ink-mute);padding:6px 12px;">데이터 없음</span>';
    return;
  }
  wrap.innerHTML = DATA.masters.map((c, i) => `<button data-idx="${i}" class="${i === STATE.creatorIdx ? 'active' : ''}">${esc(c.name_ko || c.creator_id)}</button>`).join('');
  wrap.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { STATE.creatorIdx = parseInt(btn.dataset.idx); renderCreatorTabs(); renderDash(); };
  });
}

// ==============================================
// 크리에이터 상세 뷰 (v13 그대로)
// ==============================================
function renderDash() {
  destroyCharts();
  const creator = getCreator();
  const dash = document.getElementById('dash');
  if (!creator) { dash.innerHTML = `<div class="section"><div class="empty">크리에이터 데이터가 없습니다.</div></div>`; return; }
  const allWeekly = getCreatorWeekly(creator);
  const weekly = filterByPeriod(allWeekly);
  const allVideos = getCreatorVideos(creator);
  const videos = filterVideosByPeriodWeeks(allVideos, weekly);
  if (weekly.length === 0) {
    dash.innerHTML = `<div class="section"><div class="sec-head"><span class="sec-num">DIAGNOSTIC</span><span class="sec-title">데이터 <em>매칭 실패</em></span></div><div class="empty">${esc(creator.name_ko)}와 일치하는 weekly_metrics 행이 없습니다.<br/>creator_id 일관성을 확인해주세요.</div></div>`;
    return;
  }
  const pent = computePentagon(creator, weekly);
  const periodLabel = getPeriodLabel(STATE.period, STATE.periodCustom);
  const periodRange = weekly.length > 0 ? `${weekly[0].week_label} ~ ${weekly[weekly.length-1].week_label}` : '';
  document.getElementById('footer-meta').textContent = `${periodLabel} · ${weekly.length}주 · ${videos.length}개 영상`;
  dash.innerHTML = `
    ${renderHero(creator, weekly, pent)}
    ${renderPentagon(pent)}
    ${renderDiagnosis(pent, creator)}
    ${renderSubscriberFlow(weekly, periodLabel, periodRange, creator)}
    ${renderWeeklyTrends(weekly, periodLabel, videos)}
    ${renderFormatSplit(weekly, videos)}
    ${renderVideoRanking(allVideos, allWeekly)}
  `;
  setTimeout(() => {
    buildRadarChart(pent);
    buildSubChart(weekly); buildFlowChart(weekly); buildViewsChart(weekly); buildUploadsChart(weekly);
    buildVPChart(weekly, videos); buildEngagementChart(weekly, videos);
    buildFormatViewsChart(weekly); buildFormatUploadsChart(weekly);
    const demo = getCreatorDemographics(creator);
    if (demo) buildDemographicsChart(demo);
  }, 50);
}

function renderHero(creator, weekly, pent) {
  const latest = weekly[weekly.length - 1];
  const subs = latest ? latest.subscribers : num(creator.subscribers_baseline);
  const totalNet = weekly.reduce((s, w) => s + w.sub_net, 0);
  const gradeLabel = { healthy: 'HEALTHY', watch: 'WATCH', high: 'HIGH RISK' }[pent.grade] || '—';
  return `<section class="hero"><div><div class="hero-id"><span class="hero-label-pill">${esc(creator.label || '—')}</span><span class="hero-name">${esc(creator.name_ko)}</span><span class="hero-handle">${esc(creator.channel_handle || '')}</span></div><div class="hero-stats"><span>구독자<span class="stat-val">${fmt.numK(subs)}</span></span><span>기간 순증<span class="stat-val">${fmt.signed(totalNet)}</span></span><span>분석 기간<span class="stat-val">${weekly.length}주</span></span></div></div><div class="health-block"><div class="health-eyebrow">Channel Health Score</div><div class="health-grade-row"><div class="health-score">${pent.overall}<span class="max">/100</span></div><div class="health-badge ${pent.grade}"><span class="bdot"></span>${gradeLabel}</div></div></div></section>`;
}

function renderPentagon(pent) {
  const labels = ['구독 성장', '콘텐츠 공급', '콘텐츠 효율', '인게이지먼트', '충성도'];
  const descs = [
    '신규 구독은 얼마나 들어오고, 들어온 사람은 얼마나 남는가',
    '꾸준한 발행 리듬을 유지하고 있는가',
    '업로드한 영상이 끝까지 시청되는가',
    '시청자가 좋아요·댓글·공유로 반응하는가',
    '한 번 본 시청자가 다시 돌아오는가',
  ];
  const g = pent.raw.growth, s = pent.raw.supply, e = pent.raw.efficiency, n = pent.raw.engagement, l = pent.raw.loyalty;
  const subs = [
    `${fmt.signed(Math.round(g.avgSubNet))}/주 · 유지율 ${g.avgRetention.toFixed(1)}% · sub_net(70%)+retention(30%)`,
    `${s.perWeek.toFixed(1)}건/주 · 공백 ${s.empty}주 · uploads_total`,
    `평균 ${e.avgVP.toFixed(1)}% · avg_view_pct`,
    `${n.rate.toFixed(2)}% · ${fmt.numK(n.total)}건 · (likes+comments+shares)/views`,
    l.real ? `재방문 ${l.raw} · returning_viewer_pct` : `프록시 · ${l.raw}`,
  ];
  return `<section class="pentagon-block">
    <div class="pentagon-radar-wrap">
      <div class="pentagon-radar-title">5축 균형</div>
      <div class="pentagon-radar-canvas"><canvas id="ch-radar"></canvas></div>
      <div class="pentagon-radar-note">최근 ${pent.thresholds ? pent.thresholds.baseWeeks : 12}주 분포 기준 · p75=100점</div>
    </div>
    <div class="pentagon-axes">
      ${pent.scores.map((sc, i) => {
        const cls = sc >= 70 ? 'good' : sc >= 50 ? 'mid' : 'low';
        return `<div class="pent-cell"><div class="pent-name">${labels[i]}</div><div class="pent-desc">${descs[i]}</div><div class="pent-score ${cls}">${sc}<span class="pent-score-max"> / 100</span></div><div class="pent-bar"><div class="pent-bar-fill ${cls}" style="width:${sc}%"></div></div><div class="pent-sub">${subs[i]}</div></div>`;
      }).join('')}
    </div>
  </section>`;
}

function renderDiagnosis(pent, creator) {
  const labels = ['구독 성장', '콘텐츠 공급', '콘텐츠 효율', '인게이지먼트', '충성도'];
  const indexed = pent.scores.map((s, i) => ({ s, name: labels[i] }));
  const sorted = [...indexed].sort((a, b) => a.s - b.s);
  const weakest = sorted.slice(0, 2); const strongest = sorted.slice(-2).reverse();
  let text = '';
  if (pent.overall >= 70) text = `<strong>${strongest[0].name}(${strongest[0].s})</strong>·<strong>${strongest[1].name}(${strongest[1].s})</strong> 강점. <strong>${weakest[0].name}(${weakest[0].s})</strong> 보강 시 더 안정.`;
  else if (pent.overall >= 50) text = `<strong>${weakest[0].name}(${weakest[0].s})</strong>·<strong>${weakest[1].name}(${weakest[1].s})</strong> 점검 필요. 단기 개입 권장.`;
  else text = `<strong>${weakest[0].name}(${weakest[0].s})</strong> 영역 즉시 개입 필요. 종합 ${pent.overall}점 — 채널 체력 약화 단계.`;
  const tag = { healthy: '진단 · HEALTHY', watch: '진단 · WATCH', high: '진단 · HIGH RISK' }[pent.grade];
  return `<section style="padding: 0 48px 36px;"><div class="diagnosis ${pent.grade}"><span class="diag-tag">${tag}</span>${text}</div></section>`;
}

function renderSubscriberFlow(weekly, periodLabel, periodRange, creator) {
  const gained = weekly.reduce((s, w) => s + w.sub_gained, 0);
  const lost = weekly.reduce((s, w) => s + w.sub_lost, 0);
  const net = weekly.reduce((s, w) => s + w.sub_net, 0);
  const retainRate = gained > 0 ? ((gained - lost) / gained * 100) : 0;
  const hasFlowData = gained > 0 || lost > 0;
  const demo = creator ? getCreatorDemographics(creator) : null;
  return `<section class="section"><div class="sec-head"><span class="sec-num">§ 01</span><span class="sec-title">구독자 <em>흐름</em></span><span class="sec-sub">${periodLabel} · ${periodRange}</span></div>${!hasFlowData ? `<div class="warn-banner">ⓘ sub_gained / sub_lost 값이 0입니다. sub_net만 표시됩니다.</div>` : ''}<div class="flow-grid"><div class="flow-cell gained"><div class="flow-name">신규 구독 (Gained)</div><div class="flow-val pos">+${fmt.num(gained)}</div><div class="flow-sub">주당 평균 +${fmt.num(gained/weekly.length)}명</div></div><div class="flow-cell lost"><div class="flow-name">이탈 구독 (Lost)</div><div class="flow-val neg">−${fmt.num(lost)}</div><div class="flow-sub">주당 평균 −${fmt.num(lost/weekly.length)}명</div></div><div class="flow-cell net"><div class="flow-name">순증 (Net)</div><div class="flow-val ${net >= 0 ? 'pos' : 'neg'}">${fmt.signed(net)}</div><div class="flow-sub">${hasFlowData ? `유지율 ${retainRate.toFixed(1)}% · ` : ''}주당 평균 ${fmt.signed(net/weekly.length)}명</div></div></div><div class="chart-grid-2"><div class="chart-card"><div class="chart-title">주차별 순증 추이</div><div class="chart-sub">막대 · 4주 이동평균 라인</div><div class="chart-legend"><span><span class="lg-dot" style="background:var(--blue);"></span>주간 순증</span><span><span class="lg-dot" style="background:var(--orange);"></span>4주 이동평균</span></div><div class="chart-canvas tall"><canvas id="ch-sub"></canvas></div></div><div class="chart-card"><div class="chart-title">신규 vs 이탈 흐름</div><div class="chart-sub">${hasFlowData ? '신규(양수) · 이탈(음수)' : 'sub_net만 표시'}</div><div class="chart-legend"><span><span class="lg-dot" style="background:var(--green);"></span>신규</span><span><span class="lg-dot" style="background:var(--red);"></span>이탈</span></div><div class="chart-canvas tall"><canvas id="ch-flow"></canvas></div></div></div>${renderDemographicsBlock(demo)}</section>`;
}

function renderWeeklyTrends(weekly, periodLabel, videos) {
  const totalViews = weekly.reduce((s, w) => s + w.views, 0);
  const totalWatch = weekly.reduce((s, w) => s + w.watch_time_hr, 0);
  const totalComments = weekly.reduce((s, w) => s + w.comments, 0);
  const totalLikes = weekly.reduce((s, w) => s + w.likes, 0);
  const totalShares = weekly.reduce((s, w) => s + w.shares, 0);
  const totalEng = totalComments + totalLikes + totalShares;
  return `<section class="section"><div class="sec-head"><span class="sec-num">§ 02</span><span class="sec-title">주차별 <em>트렌드</em></span><span class="sec-sub">${periodLabel}</span></div><div class="subkpi-grid" style="grid-template-columns:repeat(3,1fr);"><div class="subkpi"><div class="subkpi-name">총 조회수</div><div class="subkpi-val">${fmt.numK(totalViews)}</div><div class="subkpi-sub">주당 ${fmt.numK(totalViews/weekly.length)}</div></div><div class="subkpi"><div class="subkpi-name">시청 시간</div><div class="subkpi-val">${fmt.numK(totalWatch)}<span class="unit">시간</span></div><div class="subkpi-sub">주당 ${fmt.numK(totalWatch/weekly.length)}h</div></div><div class="subkpi"><div class="subkpi-name">총 인게이지먼트</div><div class="subkpi-val">${fmt.numK(totalEng)}</div><div class="subkpi-sub">좋아요 ${fmt.numK(totalLikes)} · 댓글 ${fmt.numK(totalComments)} · 공유 ${fmt.numK(totalShares)}</div></div></div><div class="chart-grid-2"><div class="chart-card"><div class="chart-title">주차별 조회수 추이</div><div class="chart-sub">롱폼 · 숏폼 흐름 비교</div><div class="chart-legend"><span><span class="lg-dot" style="background:var(--purple);"></span>롱폼 조회</span><span><span class="lg-dot" style="background:var(--orange);"></span>숏폼 조회</span></div><div class="chart-canvas tall"><canvas id="ch-views"></canvas></div></div><div class="chart-card"><div class="chart-title">주차별 업로드 건수</div><div class="chart-sub">롱폼 · 숏폼 발행 패턴</div><div class="chart-legend"><span><span class="lg-dot" style="background:var(--purple);"></span>롱폼</span><span><span class="lg-dot" style="background:var(--orange);"></span>숏폼</span></div><div class="chart-canvas tall"><canvas id="ch-uploads"></canvas></div></div></div><div class="chart-grid-2" style="margin-top:18px;"><div class="chart-card"><div class="chart-title">평균 시청 비율 추이</div><div class="chart-sub">avg_view_pct · 롱폼/숏폼 가중평균</div><div class="chart-legend"><span><span class="lg-dot" style="background:var(--purple);"></span>롱폼</span><span><span class="lg-dot" style="background:var(--orange);"></span>숏폼</span><span><span class="lg-dot" style="background:var(--ink-mute);"></span>채널 평균</span></div><div class="chart-canvas"><canvas id="ch-vp"></canvas></div></div><div class="chart-card"><div class="chart-title-row" style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;"><div class="chart-title">시청자 반응 추이</div><div class="ctrl-segment" id="eng-filter" style="font-size:9px;"><button data-eng="all" class="active">전체</button><button data-eng="long">롱폼</button><button data-eng="short">숏폼</button></div></div><div class="chart-sub">좋아요 · 댓글 · 공유 (절대값)</div><div class="chart-legend"><span><span class="lg-dot" style="background:var(--pink);"></span>좋아요</span><span><span class="lg-dot" style="background:var(--blue);"></span>댓글</span><span><span class="lg-dot" style="background:var(--teal);"></span>공유</span></div><div class="chart-canvas"><canvas id="ch-eng"></canvas></div></div></div></section>`;
}

function renderFormatSplit(weekly, videos) {
  const longViews = weekly.reduce((s, w) => s + w.views_long, 0);
  const shortViews = weekly.reduce((s, w) => s + w.views_short, 0);
  const longUploads = weekly.reduce((s, w) => s + w.uploads_long, 0);
  const shortUploads = weekly.reduce((s, w) => s + w.uploads_short, 0);
  const longVideos = videos.filter(v => v.video_type === 'long');
  const shortVideos = videos.filter(v => v.video_type === 'short');
  const longAvg = longUploads > 0 ? longViews / longUploads : 0;
  const shortAvg = shortUploads > 0 ? shortViews / shortUploads : 0;
  const longLikes = longVideos.reduce((s, v) => s + v.likes, 0);
  const longComments = longVideos.reduce((s, v) => s + v.comments, 0);
  const longShares = longVideos.reduce((s, v) => s + v.shares, 0);
  const shortLikes = shortVideos.reduce((s, v) => s + v.likes, 0);
  const shortComments = shortVideos.reduce((s, v) => s + v.comments, 0);
  const shortShares = shortVideos.reduce((s, v) => s + v.shares, 0);
  const longEngRate = longViews > 0 ? ((longLikes + longComments + longShares) / longViews * 100) : 0;
  const shortEngRate = shortViews > 0 ? ((shortLikes + shortComments + shortShares) / shortViews * 100) : 0;
  const cells = (vals) => vals.map(([m, v, w]) => `<div class="fmt-row"><span class="metric">${m}</span><span class="value">${v}${w ? '<span class="winner">HIGH</span>' : ''}</span></div>`).join('');
  return `<section class="section"><div class="sec-head"><span class="sec-num">§ 03</span><span class="sec-title">롱폼 vs <em>숏폼</em></span><span class="sec-sub">${videos.length}개 영상 · weekly 합계 + 영상 평균</span></div><div class="fmt-grid"><div class="fmt-cell"><div class="fmt-eyebrow">▶ LONG-FORM</div><div class="fmt-name long">롱폼</div>${cells([['업로드', longUploads + '건', longUploads > shortUploads],['총 조회', fmt.numK(longViews), longViews > shortViews],['편당 평균 조회', fmt.numK(longAvg), longAvg > shortAvg],['인게이지먼트율', longEngRate.toFixed(2) + '%', longEngRate > shortEngRate],['총 좋아요', fmt.numK(longLikes), longLikes > shortLikes],['총 댓글', fmt.numK(longComments), longComments > shortComments]])}</div><div class="fmt-cell"><div class="fmt-eyebrow">⏵ SHORT-FORM</div><div class="fmt-name short">숏폼</div>${cells([['업로드', shortUploads + '건', shortUploads > longUploads],['총 조회', fmt.numK(shortViews), shortViews > longViews],['편당 평균 조회', fmt.numK(shortAvg), shortAvg > longAvg],['인게이지먼트율', shortEngRate.toFixed(2) + '%', shortEngRate > longEngRate],['총 좋아요', fmt.numK(shortLikes), shortLikes > longLikes],['총 댓글', fmt.numK(shortComments), shortComments > longComments]])}</div></div><div class="chart-grid-2" style="margin-top:24px;"><div class="chart-card"><div class="chart-title">조회수 비중 추이</div><div class="chart-sub">롱폼 vs 숏폼 누적 조회</div><div class="chart-canvas"><canvas id="ch-fmt-views"></canvas></div></div><div class="chart-card"><div class="chart-title">업로드 비중 추이</div><div class="chart-sub">주차별 발행 빈도</div><div class="chart-canvas"><canvas id="ch-fmt-uploads"></canvas></div></div></div></section>`;

let bwTab = 'views';
function renderVideoRanking(allVideos, allWeekly) {
  // §04 자체 기간으로 필터링
  const rp = STATE.rankPeriod;
  let videos;
  if (rp === 'all') videos = allVideos;
  else if (rp === 'custom' && STATE.rankCustom) {
    videos = filterVideosByDateRange(allVideos, STATE.rankCustom.from, STATE.rankCustom.to);
  } else {
    const n = rp === 'last4' ? 4 : rp === 'last8' ? 8 : rp === 'last12' ? 12 : null;
    if (n && allWeekly.length > 0) {
      const recent = allWeekly.slice(-n);
      const validWeeks = new Set(recent.map(w => w.week_label));
      videos = allVideos.filter(v => validWeeks.has(v.week_label));
    } else videos = allVideos;
  }

  const periodLabel = getPeriodLabel(rp, STATE.rankCustom);
  const dataRange = getDataRange(allWeekly);
  const valid = videos.filter(v => v.views > 0);

  // 기간 탭 + 사용자지정 UI
  const periodTabs = ['all', 'last4', 'last8', 'last12', 'custom'].map(p => {
    const lbl = { all: '전체', last4: '최근 4주', last8: '8주', last12: '12주', custom: '사용자지정' }[p];
    const active = STATE.rankPeriod === p ? 'active' : '';
    return `<button class="${active}" onclick="window._setRankPeriod('${p}')">${lbl}</button>`;
  }).join('');

  const customUI = STATE.rankPeriod === 'custom' ? `
    <div class="date-range" style="margin-left:14px;">
      <input type="date" id="rank-from" value="${STATE.rankCustom?.from || (dataRange?.min || '')}" />
      <span class="sep">~</span>
      <input type="date" id="rank-to" value="${STATE.rankCustom?.to || (dataRange?.max || '')}" />
      <button class="apply-btn" onclick="window._applyRankCustom()">적용</button>
      <button class="reset-btn" onclick="window._resetRankPeriod()">초기화</button>
      ${dataRange ? `<span class="date-range-hint">데이터 범위: ${dataRange.min} ~ ${dataRange.max}</span>` : ''}
    </div>` : '';

  const headBlock = `
    <div class="sec-head">
      <span class="sec-num">§ 04</span>
      <span class="sec-title">영상 <em>퍼포먼스 랭킹</em></span>
      <span class="sec-sub">${periodLabel} · ${valid.length}개 영상</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;">
      <span class="ctrl-label">기간 (§04 전용)</span>
      <div class="ctrl-segment">${periodTabs}</div>
      ${customUI}
    </div>
  `;

  if (valid.length === 0) {
    return `<section class="section">${headBlock}<div class="empty">해당 기간에 영상 데이터가 없습니다.</div></section>`;
  }

  const metricLabel = { views: '조회수', engagement: '인게이지먼트율', likes: '좋아요' }[bwTab];
  const getVal = (v) => bwTab === 'views' ? v.views : bwTab === 'engagement' ? (v.views > 0 ? ((v.likes + v.comments + v.shares) / v.views * 100) : 0) : bwTab === 'likes' ? v.likes : 0;
  const sorted = [...valid].sort((a, b) => getVal(b) - getVal(a));
  const top = sorted.slice(0, 10); const bottom = sorted.slice(-10).reverse();
  const fmtVal = (v) => bwTab === 'engagement' ? getVal(v).toFixed(2) + '%' : fmt.numK(getVal(v));
  const renderRow = (v, i) => {
    const cls = v.video_type === 'long' ? 'long' : 'short';
    const tag = v.video_type === 'long' ? '▶ 롱폼' : '⏵ 숏폼';
    return `<tr><td style="width:24px;color:var(--ink-mute);font-family:var(--mono);font-size:10px;">${i+1}</td><td class="tag ${cls}">${tag}</td><td class="title" title="${esc(v.title)}">${esc(v.title)}</td><td style="font-family:var(--mono);font-size:10px;color:var(--ink-mute);width:80px;">${esc(v.week_label)}</td><td class="num" style="width:80px;">${fmtVal(v)}</td></tr>`;
  };
  return `<section class="section">${headBlock}<div class="bw-tabs"><button class="bw-tab ${bwTab === 'views' ? 'active' : ''}" onclick="window._setBW('views')">조회수</button><button class="bw-tab ${bwTab === 'engagement' ? 'active' : ''}" onclick="window._setBW('engagement')">인게이지먼트율</button><button class="bw-tab ${bwTab === 'likes' ? 'active' : ''}" onclick="window._setBW('likes')">좋아요</button></div><div class="bw-grid-split"><div class="bw-col best"><h4>▲ TOP 10 · ${metricLabel}</h4><div class="tbl-scroll"><table class="tbl"><thead><tr><th>#</th><th>유형</th><th>제목</th><th>주차</th><th class="num">${metricLabel}</th></tr></thead><tbody>${top.map((v, i) => renderRow(v, i)).join('')}</tbody></table></div></div><div class="bw-col worst"><h4>▼ BOTTOM 10 · ${metricLabel}</h4><div class="tbl-scroll"><table class="tbl"><thead><tr><th>#</th><th>유형</th><th>제목</th><th>주차</th><th class="num">${metricLabel}</th></tr></thead><tbody>${bottom.map((v, i) => renderRow(v, valid.length - bottom.length + i)).join('')}</tbody></table></div></div></div></section>`;
}

window._setBW = (m) => { bwTab = m; renderDash(); };
window._setRankPeriod = (p) => {
  STATE.rankPeriod = p;
  if (p !== 'custom') STATE.rankCustom = null;
  renderDash();
};
window._applyRankCustom = () => {
  const from = document.getElementById('rank-from').value || null;
  const to = document.getElementById('rank-to').value || null;
  if (!from && !to) { alert('시작일 또는 종료일을 입력해주세요.'); return; }
  if (from && to && from > to) { alert('시작일이 종료일보다 늦을 수 없습니다.'); return; }
  STATE.rankCustom = { from, to };
  STATE.rankPeriod = 'custom';
  renderDash();
};
window._resetRankPeriod = () => {
  STATE.rankPeriod = 'all';
  STATE.rankCustom = null;
  renderDash();
};

function buildVPChart(weekly, videos) {
  const ctx = document.getElementById('ch-vp'); if (!ctx) return;
  const labels = weekly.map(w => w.week_label);
  const longVP = [], shortVP = [], channelVP = [];
  weekly.forEach(w => {
    const wkVideos = videos.filter(v => v.week_label === w.week_label);
    const longVids = wkVideos.filter(v => v.video_type === 'long');
    const shortVids = wkVideos.filter(v => v.video_type === 'short');
    const calc = (vids) => {
      const valid = vids.filter(v => v.avg_view_pct && v.views > 0);
      if (valid.length === 0) return null;
      const totalViews = valid.reduce((s, v) => s + v.views, 0);
      const weighted = valid.reduce((s, v) => s + (v.avg_view_pct * v.views), 0);
      return totalViews > 0 ? weighted / totalViews : null;
    };
    longVP.push(calc(longVids)); shortVP.push(calc(shortVids)); channelVP.push(w.avg_view_pct || null);
  });
  const datasets = [];
  if (longVP.some(v => v !== null)) datasets.push({ label: '롱폼', data: longVP, borderColor: '#534AB7', backgroundColor: 'rgba(83,74,183,0.08)', tension: 0.3, borderWidth: 2, pointRadius: 3, fill: false, spanGaps: true });
  if (shortVP.some(v => v !== null)) datasets.push({ label: '숏폼', data: shortVP, borderColor: '#D85A30', backgroundColor: 'rgba(216,90,48,0.08)', tension: 0.3, borderWidth: 2, pointRadius: 3, fill: false, spanGaps: true });
  datasets.push({ label: '채널 평균', data: channelVP, borderColor: '#9c968a', backgroundColor: 'transparent', tension: 0.3, borderWidth: 1.5, pointRadius: 2, fill: false, borderDash: [4, 3], spanGaps: true });
  charts.vp = new Chart(ctx, { type: 'line', data: { labels, datasets }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + (ctx.raw == null ? '데이터 없음' : ctx.raw.toFixed(1) + '%') } } }, scales: { x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } }, y: { grid: { color: 'rgba(229,225,216,0.6)' }, ticks: { callback: v => v + '%' }, beginAtZero: true } } } });
}

  ]}, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + fmt.num(ctx.raw) } } }, scales: { x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } }, y: { grid: { color: 'rgba(229,225,216,0.6)' }, ticks: { callback: v => fmt.numK(v) }, beginAtZero: true } } } });
}

// ==============================================
// EVENT BINDINGS
// ==============================================
document.querySelectorAll('.vt-btn').forEach(btn => { btn.onclick = () => setView(btn.dataset.view); });
document.querySelectorAll('#period-tabs button').forEach(btn => {
  btn.onclick = () => {
    STATE.period = btn.dataset.period;
    document.querySelectorAll('#period-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const customRange = document.getElementById('period-custom-range');
    if (STATE.period === 'custom') {
      customRange.style.display = '';
      // 데이터 범위 표시
      const creator = getCreator();
      if (creator) {
        const allWeekly = getCreatorWeekly(creator);
        const range = getDataRange(allWeekly);
        if (range) {
          document.getElementById('period-range-hint').textContent = `데이터 범위: ${range.min} ~ ${range.max}`;
          // 초기 값을 비워두고 placeholder 역할만
          const fromInp = document.getElementById('period-from');
          const toInp = document.getElementById('period-to');
          if (!fromInp.value) fromInp.value = range.min;
          if (!toInp.value) toInp.value = range.max;
        }
      }
    } else {
      customRange.style.display = 'none';
      STATE.periodCustom = null;
      renderDash();
    }
  };
});
document.getElementById('period-apply').onclick = () => {
  const from = document.getElementById('period-from').value || null;
  const to = document.getElementById('period-to').value || null;
  if (!from && !to) { alert('시작일 또는 종료일을 입력해주세요.'); return; }
  if (from && to && from > to) { alert('시작일이 종료일보다 늦을 수 없습니다.'); return; }
  STATE.periodCustom = { from, to };
  STATE.period = 'custom';
  renderDash();
};
document.getElementById('period-reset').onclick = () => {
  document.getElementById('period-from').value = '';
  document.getElementById('period-to').value = '';
  STATE.periodCustom = null;
  STATE.period = 'all';
  document.querySelectorAll('#period-tabs button').forEach(b => b.classList.remove('active'));
  document.querySelector('#period-tabs button[data-period="all"]').classList.add('active');
  document.getElementById('period-custom-range').style.display = 'none';
  renderDash();
};
document.getElementById('mat-modal').onclick = (e) => { if (e.target.id === 'mat-modal') window._closeMatModal(); };

// ==============================================
// INIT
// ==============================================
async function init() {
  try {
    await loadData();
    if (DATA.masters.length === 0) throw new Error('creators_master 데이터 없음');
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderCreatorTabs();
    setView('overview');
  } catch (err) {
    console.error('[Init failed]', err);
    const errMsg = err.message || String(err);
    let hint = '';
    if (errMsg.includes('Failed to fetch') || errMsg.includes('NetworkError')) {
      hint = `<div style="margin-top:20px;padding:14px 18px;background:var(--bg-soft);border-left:3px solid var(--red);text-align:left;max-width:560px;font-family:var(--sans);font-size:12.5px;line-height:1.7;color:var(--ink);"><strong>가능한 원인:</strong><br/>1. HTML을 로컬 파일(file://)로 직접 열었을 때 → GitHub Pages 또는 로컬 서버로 열어주세요<br/>2. Google Sheets 게시 설정이 풀렸을 가능성<br/>3. 네트워크 차단</div>`;
    }
    document.getElementById('loading').innerHTML = `<div class="title" style="color:var(--red);">로드 실패</div><div class="sub" style="margin-top:8px;">${esc(errMsg)}</div>${hint}<button onclick="location.reload()" style="margin-top:24px;padding:8px 20px;background:var(--ink);color:white;border:none;font-family:var(--mono);font-size:11px;letter-spacing:0.1em;cursor:pointer;">RETRY</button>`;
  }
}

init();
</script>
